<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131b4a">
<meta name="description" content="Cat Evolution: despierta estatuas de gatos, crúzalos en distintos hábitats y descubre mutaciones.">
<link rel="icon" href="arte/icono_app.png">
<link rel="apple-touch-icon" href="arte/icono_app.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}</style>
<title>Cat Evolution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: app de una columna; templo arriba, contenido en pestañas y barra de navegación fija abajo */
:root{
  --bg:#131b4a;
  --bg-hi:#1d2a6e;
  --panel:#202f7a;
  --panel-hi:#2a3b8f;
  --sand:#f1ddb0;
  --sand-ink:#3a2814;
  --gold:#f4c24f;
  --turq:#36cbb9;
  --ink:#f7f0e2;
  --muted:#aeb6e0;
  --r-comun:#c9b48a;
  --r-raro:#36cbb9;
  --r-epico:#b48cff;
  --r-legend:#f4c24f;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--body);
  background:
    radial-gradient(110% 55% at 50% 0%,var(--bg-hi) 0%,transparent 70%),
    repeating-linear-gradient(90deg,transparent 0 46px,rgba(244,194,79,.035) 46px 48px),
    var(--bg);
  background-attachment:fixed;
  padding-inline:16px;display:flex;justify-content:center;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
}
.app{width:100%;max-width:520px;padding-block:0 110px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{cursor:default;opacity:.5}
h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0;letter-spacing:.01em}
.cat{display:block;width:100%;height:auto;overflow:visible}

.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:12px;background:linear-gradient(var(--bg) 70%,transparent);
}
.logo{font-family:var(--display);font-size:1.5rem;line-height:1}
.logo em{font-style:normal;color:var(--gold)}
.purse{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:6px 14px 6px 8px;font-weight:900;font-variant-numeric:tabular-nums}
.purse svg{width:22px;height:22px}
.purse.bump{animation:pulse .4s}

/* Templo vivo: escena con fondo (cielo, pirámides, Nilo), mundo (objetos + gatos ordenados por profundidad) y columnas al frente */
.scene{
  position:relative;aspect-ratio:400/560;width:min(100%,max(300px,calc((100dvh - 250px) / 1.4)));margin:4px auto 0;
  border-radius:24px;overflow:hidden;background:var(--bg-hi);box-shadow:0 18px 40px rgba(0,0,0,.35);isolation:isolate;
}
.scene .bg,.scene .fg,.scene .fx{position:absolute;inset:0;pointer-events:none}
.scene .bg svg,.scene .fg svg{width:100%;height:100%;display:block}
.world{position:absolute;inset:0}
.fx{z-index:1500;overflow:hidden}
.fg{z-index:2000}
.say{
  position:absolute;z-index:2100;left:12px;right:12px;top:12px;margin:0;background:var(--sand);color:var(--sand-ink);
  border-radius:16px;padding:9px 12px;font-weight:800;font-size:.9rem;line-height:1.35;box-shadow:0 6px 16px rgba(0,0,0,.25);
}
.say::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--sand)}
.say small{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
.obj{position:absolute;transform:translate(-50%,-100%);padding:0;display:block}
.obj svg{display:block;width:100%;height:auto}
.obj .tag{
  position:absolute;left:50%;top:0;transform:translate(-50%,-100%);white-space:nowrap;z-index:1;
  background:rgba(19,27,74,.88);color:var(--ink);border-radius:99px;padding:2px 9px;font-size:.72rem;font-weight:900;font-variant-numeric:tabular-nums;
}
.obj .tag.gold{background:var(--gold);color:var(--sand-ink)}
.obj .tag:empty{display:none}
.obj.sphinx.asleep .tag{animation:pulse 1.4s infinite}
.obj.sarc-obj svg{filter:drop-shadow(0 0 9px var(--glow,transparent))}
.obj.sarc-obj.ready svg{animation:wobble 1.2s infinite}
.obj.sarc-obj.empty svg{opacity:.6}
.walker{position:absolute;left:0;top:0;padding:0;transform-origin:50% 100%;will-change:transform}
.walker::before{content:"";position:absolute;left:20%;right:20%;bottom:-3%;height:9%;border-radius:50%;background:rgba(0,0,0,.22)}
.walker .flip{position:relative;width:100%;aspect-ratio:200/210}
.walker .side,.walker .front{position:absolute;left:0;right:0;bottom:0}
.walker .side{display:none}
.walker.walking .side{display:block}
.walker.walking .front{display:none}
.walker.walking .side svg{animation:bob .38s ease-in-out infinite alternate}
.lgA,.lgB{transform-box:fill-box;transform-origin:50% 8%}
.walker.walking .lgA{animation:leg .38s ease-in-out infinite alternate}
.walker.walking .lgB{animation:leg .38s ease-in-out infinite alternate-reverse}
.emote{position:absolute;left:50%;top:0;transform:translateX(-50%);font-weight:900;font-size:1.4rem;color:#ff6f91;opacity:0;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.emote.on{animation:emote 1.6s ease-out}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .2s infinite alternate}
.glowp{animation:glowp 2.6s ease-in-out infinite alternate}
.shim{animation:shim 3.2s ease-in-out infinite alternate}
.twinkle{animation:twinkle 2.2s ease-in-out infinite alternate}
.mote{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,244,210,.75);opacity:0;animation:drift 10s linear infinite}
.night .mote{background:#e2ff9a;box-shadow:0 0 8px 2px rgba(226,255,154,.6)}
.temple-actions{margin-top:14px}
.btn{border-radius:14px;padding:12px 16px;font-weight:900;background:var(--panel-hi)}
.btn.gold{background:var(--gold);color:var(--sand-ink);box-shadow:0 4px 0 #b9881f}
.btn.gold:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #b9881f}
.btn.turq{background:var(--turq);color:#08302b;box-shadow:0 4px 0 #23917f}
.btn.turq:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #23917f}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@keyframes leg{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3%)}}
@keyframes emote{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1)}100%{opacity:0;transform:translate(-50%,-38px)}}
@keyframes flicker{from{transform:scale(1,1)}to{transform:scale(.9,1.12)}}
@keyframes glowp{from{opacity:.7}to{opacity:1}}
@keyframes shim{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
@keyframes drift{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:.8}100%{transform:translate(34px,-140px);opacity:0}}
@media (prefers-reduced-motion:reduce){.walker.walking .side svg,.walker.walking .lgA,.walker.walking .lgB,.flame,.glowp,.shim,.twinkle,.mote,.obj.sarc-obj.ready svg,.obj.sphinx.asleep .tag{animation:none}.mote{display:none}}

/* Gatos */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:540px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{
  background:var(--sand);color:var(--sand-ink);border-radius:20px;padding:10px 10px 12px;text-align:left;
  display:grid;gap:4px;position:relative;
}
.card .art{border-radius:14px;padding:6px 10px 0;background:radial-gradient(circle at 50% 60%,var(--halo,#fff7e6) 0%,transparent 70%)}
.card .name{font-family:var(--display);font-size:1.1rem;line-height:1.1}
.card .meta{font-size:.78rem;font-weight:800;opacity:.75}
.card.stone{background:#d9c9a3}
.card.stone .name{opacity:.7}
.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:.72rem;font-weight:900;letter-spacing:.04em;color:#1c1430}
.b-comun{background:var(--r-comun)}.b-raro{background:var(--r-raro)}.b-epico{background:var(--r-epico)}.b-legend{background:var(--r-legend)}
.card.legend{box-shadow:0 0 0 3px var(--r-legend),0 0 22px rgba(244,194,79,.45)}
.card.epico{box-shadow:0 0 0 3px var(--r-epico)}
.book{display:grid;gap:10px}
.fam{background:var(--panel);border-radius:16px;padding:12px}
.fam h3{margin:0 0 8px;font-size:.95rem;font-weight:900;display:flex;justify-content:space-between}
.fam h3 span{color:var(--muted);font-weight:800}
.fam ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fam li{background:var(--bg);border-radius:10px;padding:7px 10px;font-size:.85rem;font-weight:800}
.fam li.no{color:var(--muted);font-weight:600}
.fam li small{display:block;font-size:.7rem;color:var(--muted);font-weight:700}
.reset{margin-top:28px;color:var(--muted);font-size:.85rem;text-decoration:underline;justify-self:start}
.reset.confirm{color:#ff8a8a;font-weight:900}

/* Juegos */
.game{background:var(--panel);border-radius:20px;padding:16px;display:grid;gap:6px}
.game b{font-family:var(--display);font-weight:400;font-size:1.25rem}
.game p{margin:0;color:var(--muted);line-height:1.45}
.soon{justify-self:start;background:var(--bg);color:var(--gold);border-radius:99px;padding:3px 10px;font-size:.75rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase}

/* Ofrendas (match-3): encabezado, metas, tablero de 8×8 con piezas que caen */
.match{display:grid;gap:10px;padding-block:6px 20px}
.mhead{display:flex;align-items:center;gap:10px}
.mhead .back.confirm{background:var(--gold);color:var(--sand-ink)}
.mtitle{flex:1;min-width:0;line-height:1.1}
.mtitle small{display:block;color:var(--muted);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.mtitle strong{font-family:var(--display);font-weight:400;font-size:1.4rem}
.mmoves{text-align:center;background:var(--panel);border-radius:14px;padding:4px 14px}
.mmoves b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.mmoves small{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.mgoals{display:flex;gap:8px;flex-wrap:wrap}
.mgoal{display:grid;grid-template-columns:34px auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;background:var(--panel);border-radius:14px;padding:6px 12px 6px 6px}
.mgoal svg{grid-row:span 2;width:34px;height:34px}
.mgoal span{font-family:var(--display);font-size:1.3rem;line-height:1;font-variant-numeric:tabular-nums}
.mgoal small{font-size:.72rem;color:var(--muted);font-weight:800}
.mgoal.done{background:var(--turq);color:#08302b}
.mgoal.done small{color:#08302b}
.mstatus{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mstars{display:flex;align-items:center;gap:2px;font-size:1.3rem;color:#4a5394}
.mstars i{font-style:normal}
.mstars i.on{color:var(--gold)}
.mstars small{font-size:.72rem;color:var(--muted);margin-left:6px;font-weight:800}
.mscore{font-weight:800;color:var(--muted)}
.mscore b{color:var(--ink);font-variant-numeric:tabular-nums}
.mboard{
  position:relative;width:min(100%,max(280px,calc(100dvh - 310px)));aspect-ratio:1;margin-inline:auto;border-radius:16px;
  background:#1a2360;touch-action:none;overflow:hidden;box-shadow:0 0 0 5px #c9a66b,0 0 0 8px #2a1f35,0 16px 36px rgba(0,0,0,.4);
}
.mcell{position:absolute;width:12.5%;height:12.5%}
.mcell.alt{background:rgba(255,255,255,.05)}
.mcell.sand{background:radial-gradient(circle at 30% 30%,#c79a52 0 6%,transparent 7%),radial-gradient(circle at 70% 65%,#c79a52 0 5%,transparent 6%),#e2bf7e;box-shadow:inset 0 0 0 2px #c9a66b}
.mcell.swept{animation:swept .5s ease-out}
.tile{position:absolute;left:0;top:0;width:12.5%;height:12.5%;padding:.6%;transition:transform .22s cubic-bezier(.3,.1,.3,1),opacity .22s;will-change:transform}
.tile svg{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.tile.sel svg{animation:selp .7s ease-in-out infinite}
.tile.pop{opacity:0}
.tile.born svg{animation:born .4s cubic-bezier(.2,1.6,.4,1)}
.tile.hint svg{animation:wiggle .5s ease-in-out 3}
.blast{position:absolute;pointer-events:none;z-index:5;background:rgba(255,246,196,.85);border-radius:8px;animation:blast .55s ease-out forwards}
.blast.h{left:0;width:100%;height:12.5%}
.blast.v{top:0;height:100%;width:12.5%}
.blast.b{width:37.5%;height:37.5%;border-radius:50%}
.blast.r{width:12.5%;height:12.5%;border-radius:50%;background:radial-gradient(circle,#fff6c4,rgba(244,194,79,0));animation:ring .6s ease-out forwards}
.mfloat{position:absolute;z-index:6;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--display);font-size:1.2rem;color:#fff;text-shadow:0 2px 0 #2a1f35,0 0 6px #2a1f35;animation:mfloat 1s ease-out forwards;white-space:nowrap}
.mfloat.big{font-size:1.7rem;color:var(--gold)}
.mini-pieces{display:flex;gap:6px}
.mini-pieces svg{width:34px;height:34px}
.bigstars{display:flex;gap:6px;font-size:3rem;color:#4a5394;line-height:1}
.bigstars i{font-style:normal}
.bigstars i.on{color:var(--gold);animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes selp{50%{transform:scale(1.12)}}
@keyframes born{from{transform:scale(.4)}to{transform:none}}
@keyframes wiggle{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes blast{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.15)}}
@keyframes ring{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(9)}}
@keyframes mfloat{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}20%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-140%)}}
@keyframes swept{from{background:#fff6c4}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile.sel svg,.tile.born svg,.tile.hint svg,.blast,.mfloat,.bigstars i.on,.mcell.swept{animation:none}}

/* Pirámide y mejoras */
.wallet{display:flex;gap:8px}
.wallet .purse{padding:6px 12px 6px 8px}
.pwrap{display:flex;justify-content:center}
.pwrap canvas{display:block;touch-action:none;max-width:100%}
.ups{display:grid;gap:8px}
.up{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel);border-radius:14px;padding:10px 12px}
.up b{display:block}
.up small{display:block;color:var(--muted);font-size:.84rem;line-height:1.35;margin-top:2px}
.up .btn{padding:9px 12px;white-space:nowrap}
.up.done{opacity:.75}
.up-ok{color:var(--turq);font-weight:900;font-size:.85rem}
.obj.pond{pointer-events:none}
.dig-link{justify-self:center;color:var(--muted);font-weight:800;font-size:.88rem;text-decoration:underline;padding:6px}
/* Poderes de los gatos */
.powers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.power{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:14px;padding:4px 8px 4px 4px;text-align:left;min-width:0}
.power .pw-cat{width:34px;flex:none}
.power .pw-txt{min-width:0;line-height:1.15}
.power .pw-txt b{display:block;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.power .pw-txt small{font-size:.7rem;color:var(--muted);font-weight:800}
.power.on{background:var(--turq);color:#08302b}
.power.on small{color:#08302b}
.power:disabled{opacity:.55}
.pick .card .pw{font-size:.72rem;font-weight:900;color:#1d6f5f;line-height:1.2}
.stuck{margin:0;background:var(--gold);color:var(--sand-ink);border-radius:14px;padding:10px 12px;font-weight:800;text-align:center}
.stuck button{text-decoration:underline;font-weight:900}
.powinfo{display:grid;gap:6px}
.powinfo div{background:var(--panel);border-radius:12px;padding:10px 12px}
.powinfo b{display:block}
.powinfo small{color:var(--muted);font-weight:700}
/* Arte final (imágenes de Gemini) */
.scene .bg img{width:100%;height:100%;object-fit:cover;display:block}
.obj img{display:block;width:100%;height:auto;pointer-events:none}
.obj.sarc-obj img{filter:drop-shadow(0 0 9px var(--glow,transparent))}
.obj.sarc-obj.ready img{animation:wobble 1.2s infinite}
.obj.sarc-obj.empty img{opacity:.6}
.purse img{width:22px;height:22px;display:block}
.art-img{display:block;width:100%;height:auto}
.art-img.cracked{filter:contrast(1.15) brightness(.92)}
/* Hábitats y Abuelo Colmillo */
.habbar{display:flex;gap:6px;margin:4px 0 8px}
.hab{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:12px;padding:9px 6px;background:var(--panel);font-weight:900;font-size:.84rem;white-space:nowrap}
.hab svg{width:14px;height:14px;flex:none}
.hab[aria-selected="true"]{background:var(--gold);color:var(--sand-ink)}
.hab.locked{color:var(--muted)}
.say{display:flex;gap:10px;align-items:center;text-align:left;font:inherit}
.say-av{width:44px;flex:none}
.say-txt{min-width:0}
.say::after{left:30px}
.abuelo{display:block;width:100%;height:auto}
.abuelo .eyeglow{opacity:0}
.abuelo.glow .eyeglow{animation:eyeglow 2.6s ease-in-out}
.abuelo.art{position:relative;display:block}
.abuelo.art img{display:block;width:100%;height:auto}
.abuelo.art img.eyeglow{position:absolute;inset:0}
@keyframes eyeglow{0%{opacity:0}20%{opacity:1}75%{opacity:1}100%{opacity:0}}
.elder{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;width:max-content;max-width:min(480px,calc(100vw - 32px));background:var(--sand);color:var(--sand-ink);border-radius:18px;padding:8px 14px 8px 8px;box-shadow:0 12px 32px rgba(0,0,0,.4)}
.elder.show{animation:elderIn .45s cubic-bezier(.2,1.4,.4,1)}
.elder-av{width:62px;flex:none}
.elder p{margin:0;font-weight:800;font-size:.92rem;line-height:1.35}
@keyframes elderIn{from{transform:translate(-50%,-24px) scale(.94)}to{transform:translate(-50%,0)}}
.snow{position:absolute;top:-3%;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9;animation:snowfall 7s linear infinite}
@keyframes snowfall{from{top:-3%;transform:translateX(0)}50%{transform:translateX(14px)}to{top:103%;transform:translateX(-6px)}}
.movebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border-radius:12px;padding:10px 12px}
.movebar span{flex:1;min-width:140px;color:var(--muted);font-weight:700}
.movebar b{color:var(--ink)}
.movebar .btn{padding:8px 12px}
.hab-preview{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:end;width:min(70vw,280px);justify-self:center}
.hab-preview svg,.hab-preview img{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:reduce){.snow{display:none}.abuelo.glow .eyeglow{animation:none;opacity:1}.elder.show{animation:none}}
/* Levantar, acariciar y nombrar gatos */
.walker{touch-action:none;-webkit-touch-callout:none}
.walker .hang{display:none;position:absolute;left:0;right:0;top:0}
.walker.lifted .front,.walker.lifted .side{display:none}
.walker.lifted .hang{display:block}
.walker.lifted::before{display:none}
.walker.lifted .hang svg{transform-origin:50% 3%;animation:sway 1.1s ease-in-out infinite alternate}
.lift-layer{position:fixed;inset:0;pointer-events:none;z-index:45}
.lift-layer .walker{position:absolute;left:0;top:0;filter:drop-shadow(0 14px 10px rgba(0,0,0,.35))}
.walker.land .front svg{animation:land .45s cubic-bezier(.3,1.6,.5,1)}
.dust{position:absolute;width:14%;height:3.5%;border-radius:50%;background:rgba(255,255,255,.6);transform:translate(-50%,-50%);pointer-events:none;z-index:999;animation:dust .55s ease-out forwards}
.namechip{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;white-space:nowrap;background:rgba(19,27,74,.92);color:var(--ink);border-radius:99px;padding:4px 4px 4px 11px;font-weight:900;font-size:.78rem;z-index:3}
.namechip .hearts{color:#ff8fb0}
.namechip button{background:var(--gold);color:var(--sand-ink);border-radius:99px;padding:3px 9px;font-weight:900;font-size:.72rem}
.pencil{width:30px;height:30px;border-radius:10px;background:var(--panel);display:inline-grid;place-items:center;vertical-align:middle;margin-left:4px}
.pencil svg{width:16px;height:16px}
#cat-title{display:flex;align-items:center;gap:6px;min-width:0}
#cat-title input,.namefield input{font:inherit;font-family:var(--display);font-size:1.2rem;color:var(--sand-ink);background:var(--sand);border:0;border-radius:10px;padding:6px 10px;min-width:0;width:100%}
#cat-title .btn{padding:8px 12px;font-family:var(--body);font-size:.9rem}
.namefield{display:grid;gap:6px;font-weight:800;color:var(--muted);font-size:.85rem}
.love{display:grid;gap:6px;background:var(--panel);border-radius:12px;padding:10px 12px}
.love-top{display:flex;justify-content:space-between;align-items:baseline}
.love-top span{color:#ff8fb0;font-weight:900;font-variant-numeric:tabular-nums}
.love .bar{height:10px;margin:0;background:var(--bg);border-radius:99px;overflow:hidden}
.love .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff8fb0,#ff5f8f);transition:width .4s}
.love small{color:var(--muted);font-weight:700}
.cat-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat-acts .btn{padding:10px 6px;font-size:.88rem}
.hero{position:relative}
.hero-heart{position:absolute;left:50%;top:20%;font-size:2rem;color:#ff5f8f;font-weight:900;pointer-events:none;animation:emote 1.2s ease-out forwards}
.hero.playing .cat{animation:wobble .5s 2}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes land{0%{transform:translateY(-16%)}55%{transform:translateY(0) scale(1.12,.86)}100%{transform:none}}
@keyframes dust{from{opacity:.9;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(-50%,-50%) scale(1.7)}}
@media (prefers-reduced-motion:reduce){.walker.lifted .hang svg,.walker.land .front svg,.dust,.hero-heart,.hero.playing .cat{animation:none}}
/* Gato real (imágenes pintadas) */
img.catimg{display:block;width:100%;height:auto}
.walker .front img.catimg{position:absolute;left:0;bottom:0}
.walker.walking .side img.catimg{animation:stepimg .32s ease-in-out infinite alternate;transform-origin:50% 100%}
.walker.lifted .hang img.catimg{transform-origin:50% 3%;animation:sway 1.1s ease-in-out infinite alternate}
@keyframes stepimg{from{transform:translateY(0) rotate(-2.5deg)}to{transform:translateY(-4%) rotate(2.5deg)}}
@media (prefers-reduced-motion:reduce){.walker.walking .side img.catimg,.walker.lifted .hang img.catimg{animation:none}}
/* Resplandor del Abuelo cuando no hay imagen con ojos brillantes */
.abuelo.art.glow img:first-child{animation:aura 2.6s ease-in-out}
@keyframes aura{0%,100%{filter:none}20%,75%{filter:drop-shadow(0 0 6px #e9ff6a) drop-shadow(0 0 16px #9dff2a) brightness(1.08)}}
@media (prefers-reduced-motion:reduce){.abuelo.art.glow img:first-child{animation:none}}
/* Navegación */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(15,21,60,.94);backdrop-filter:blur(8px);
}
.tabs div{width:100%;max-width:520px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border-radius:14px;padding:10px 4px;font-weight:900;font-size:.9rem;color:var(--muted);display:grid;justify-items:center;gap:2px}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink)}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:-2px}

/* Hoja inferior */
.sheet{position:fixed;inset:0;z-index:10;background:rgba(8,12,36,.72);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px 0}
.sheet-card{
  width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--bg-hi);border-radius:26px 26px 0 0;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .32s cubic-bezier(.2,1.2,.4,1);
}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{width:38px;height:38px;border-radius:12px;background:var(--panel);font-size:1.3rem;line-height:1}
.hero{width:min(64vw,250px);justify-self:center;position:relative}
.hero.halo{background:radial-gradient(circle at 50% 60%,var(--halo,rgba(255,255,255,.12)) 0%,transparent 68%)}
.center{text-align:center;display:grid;gap:6px;justify-items:center}
.big-name{font-family:var(--display);font-size:2rem;line-height:1}
.genes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.genes li{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border-radius:12px;padding:10px 12px;font-weight:800}
.genes li span{color:var(--muted);font-weight:700}
.genes li.mut{box-shadow:inset 4px 0 0 var(--fc)}
.genes li.mut b{color:var(--fc)}
.note{margin:0;color:var(--muted);line-height:1.45;font-size:.92rem;text-align:center}
.new-mut{background:var(--gold);color:var(--sand-ink);border-radius:14px;padding:10px 12px;font-weight:900;text-align:center}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick .card{padding:6px 6px 8px;gap:2px;font-size:.9rem}
.pick .card .name{font-size:.95rem}
.pick .card[aria-pressed="true"]{box-shadow:0 0 0 4px var(--turq)}
.pick .card .tag{position:absolute;top:6px;left:6px;background:var(--turq);color:#08302b;border-radius:99px;font-weight:900;font-size:.75rem;padding:1px 8px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center;font-weight:900}
.pair .cat{width:90px;margin:auto}
.pair .ph{width:90px;height:94px;margin:auto;border-radius:16px;border:2px dashed var(--panel-hi)}
.plus{font-family:var(--display);font-size:1.6rem;color:var(--gold)}

.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:20;transform:translateX(-50%);
  background:var(--sand);color:var(--sand-ink);font-weight:900;border-radius:14px;padding:10px 16px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100vw - 32px);text-align:center;
}
.waking{animation:shake .9s}
.flash{animation:flash .7s}
.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-6px) rotate(-2deg)}30%{transform:translateX(6px) rotate(2deg)}45%{transform:translateX(-8px) rotate(-3deg)}60%{transform:translateX(8px) rotate(3deg)}80%{transform:translateX(-4px)}}
@keyframes flash{0%{filter:brightness(3) saturate(0)}100%{filter:none}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes up{from{transform:translateY(60px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.waking,.flash,.pop,.slot.ready .sarc,.sheet-card,.purse.bump{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">Cat <em>Evolution</em></div>
    <div class="wallet">
    <div class="purse" id="purse" title="Ofrendas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f4c24f" stroke="#7a5410" stroke-width="1.2" d="M12 2.5c-2.6 0-4.3 2-4.3 4.4 0 1.7.9 3.1 2.2 4.1H5.5v2.6h5.2V21.5h2.6V13.6h5.2V11h-4.4c1.3-1 2.2-2.4 2.2-4.1 0-2.4-1.7-4.4-4.3-4.4zm0 2.4c1.1 0 1.8.9 1.8 2s-.8 2.4-1.8 3.3c-1-.9-1.8-2.2-1.8-3.3s.7-2 1.8-2z"/></svg>
      <b id="ofr">0</b><span class="sr" hidden>ofrendas</span>
    </div>
    <div class="purse" id="purse-stone" title="Piedra">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20L12 4l9 16z" fill="#e2bf7e" stroke="#7a5410" stroke-width="1.2" stroke-linejoin="round"/><path d="M12 4l9 16h-6z" fill="#c39d5f"/><path d="M7.5 12h9M5.2 16h13.6" stroke="#a8834a" stroke-width="1"/></svg>
      <b id="stone">0</b>
    </div>
    </div>
  </header>

  <main>
    <section id="tab-templo"></section>
    <section id="tab-gatos" hidden></section>
    <section id="tab-juegos" hidden></section>
    <section id="tab-match" class="match" hidden></section>
    <section id="tab-pyr" class="match" hidden></section>
  </main>
</div>

<nav class="tabs" id="tabs" hidden>
  <div role="tablist">
    <button class="tab" role="tab" data-tab="templo" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L2 21h20L12 3z"/><path d="M7 21l5-9 5 9"/></svg>Hábitat</button>
    <button class="tab" role="tab" data-tab="gatos" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 20c0-6 2-8 2-8L5 4l5 3h4l5-3-2 8s2 2 2 8H5z"/></svg>Gatos<span class="dot" id="dot-gatos" hidden></span></button>
    <button class="tab" role="tab" data-tab="juegos" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>Juegos</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheet-card" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="lift-layer" id="lift-layer" aria-hidden="true"></div>
<div class="elder" id="elder" hidden role="status"><div class="elder-av" id="elder-av"></div><p id="elder-msg"></p></div>

<script>
(() => {
  'use strict';
  // ================= Reglas del juego (valores de prueba) =================
  const COST = { awaken: 15, breed: 10, dig: 50 };
  const ALTAR = { get everyMs() { return S.up && S.up.altar ? 3000 : 4000; }, get cap() { return S.up && S.up.altar ? 80 : 40; } }; // el Altar mayor lo mejora
  const INCUBATE = { comun: 15, raro: 40, epico: 90, legend: 180 }; // segundos (en el juego final serían horas)
  const MUT_RATE = 0.14;                                // probabilidad de mutación por gen
  const FAM_WEIGHT = { elegante: .55, egipcio: .30, mistico: .15, artico: 0 }; // la Ártica solo sale en la Nieve o por herencia

  const RARITY = {
    comun: { label: 'Común', cls: 'b-comun', halo: '#fff3d6' },
    raro: { label: 'Raro', cls: 'b-raro', halo: '#bff3ec' },
    epico: { label: 'Épico', cls: 'b-epico', halo: '#e3d4ff' },
    legend: { label: 'Legendario', cls: 'b-legend', halo: '#ffe7a3' },
  };
  const FAMILY = {
    elegante: { label: 'Elegante', color: '#dfe5f2' },
    egipcio: { label: 'Egipcia', color: '#f4c24f' },
    mistico: { label: 'Mística', color: '#b48cff' },
    artico: { label: 'Ártica', color: '#9fe3ff' },
  };
  const GENES = {
    fur:  { label: 'Pelaje',    common: ['naranja', 'gris', 'negro', 'blanco', 'crema', 'cafe'], mut: { elegante: 'plateado', egipcio: 'dorado', mistico: 'cosmico', artico: 'nevado' } },
    pat:  { label: 'Patrón',    common: ['liso', 'atigrado', 'manchas', 'bicolor'],              mut: { elegante: 'smoking', egipcio: 'jeroglificos', mistico: 'constelacion', artico: 'escarcha' } },
    eyes: { label: 'Ojos',      common: ['verde', 'ambar', 'azul'],                               mut: { elegante: 'heterocromia', egipcio: 'kohl', mistico: 'galaxia', artico: 'hielo' } },
    acc:  { label: 'Accesorio', common: ['ninguno', 'cascabel'],                                  mut: { elegante: 'mono', egipcio: 'usekh', mistico: 'luna', artico: 'bufanda' } },
  };
  const GENE_KEYS = Object.keys(GENES);
  const NAMES_OF = {
    naranja: 'Naranja', gris: 'Gris', negro: 'Negro', blanco: 'Blanco', crema: 'Crema', cafe: 'Café',
    plateado: 'Plateado', dorado: 'Dorado', cosmico: 'Cósmico', arena: 'Arena',
    liso: 'Liso', atigrado: 'Atigrado', manchas: 'Manchas', bicolor: 'Bicolor',
    smoking: 'Esmoquin', jeroglificos: 'Jeroglíficos', constelacion: 'Constelación',
    verde: 'Verdes', ambar: 'Ámbar', azul: 'Azules', heterocromia: 'Heterocromía', kohl: 'Delineado de Horus', galaxia: 'Galaxia',
    ninguno: 'Ninguno', cascabel: 'Cascabel', mono: 'Moño de gala', usekh: 'Collar usekh', luna: 'Tiara lunar', nemes: 'Tocado nemes',
    nevado: 'Nevado', escarcha: 'Escarcha', hielo: 'Ojos de hielo', bufanda: 'Bufanda',
  };
  const MUT_FAMILY = {};
  GENE_KEYS.forEach(k => Object.entries(GENES[k].mut).forEach(([fam, v]) => { MUT_FAMILY[v] = fam; }));
  const CAT_NAMES = ['Cleo', 'Nefer', 'Ramsés', 'Tut', 'Isis', 'Osiris', 'Anubis', 'Horus', 'Seti', 'Amira', 'Nilo', 'Kaia', 'Luna', 'Momo', 'Churro', 'Canela', 'Mango', 'Kiwi', 'Oreo', 'Nala', 'Pelusa', 'Tamal', 'Concha', 'Michi', 'Bigotes', 'Dátil', 'Papiro', 'Menta', 'Chispa', 'Miel', 'Coco', 'Simón', 'Pixel', 'Nube', 'Duna', 'Cairo', 'Giza', 'Zafiro', 'Perla', 'Ónix', 'Sol', 'Tofu', 'Nacho', 'Pistache'];

  const rarityOf = g => { const n = GENE_KEYS.filter(k => MUT_FAMILY[g[k]]).length; return n === 0 ? 'comun' : n === 1 ? 'raro' : n === 2 ? 'epico' : 'legend'; };
  function styleOf(g) {
    const c = {};
    GENE_KEYS.forEach(k => { const f = MUT_FAMILY[g[k]]; if (f) c[f] = (c[f] || 0) + 1; });
    const order = ['mistico', 'artico', 'egipcio', 'elegante'];
    let best = null;
    order.forEach(f => { if (c[f] && (!best || c[f] > c[best])) best = f; });
    return best ? FAMILY[best].label : 'Caricatura';
  }
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  function pickFamily(bias) {
    const w = { ...FAM_WEIGHT };
    Object.entries(bias || {}).forEach(([f, n]) => { w[f] += n * .25; });
    let x = Math.random() * Object.values(w).reduce((a, b) => a + b, 0);
    for (const [f, v] of Object.entries(w)) { x -= v; if (x < 0) return f; }
    return 'elegante';
  }
  function breedGenes(a, b, forceMutation, fav) {
    const bias = {};
    if (fav) bias[fav] = 2.4; // el hábitat favorece a su familia
    [a, b].forEach(p => GENE_KEYS.forEach(k => { const f = MUT_FAMILY[p.genes[k]]; if (f) bias[f] = (bias[f] || 0) + 1; }));
    const g = {};
    GENE_KEYS.forEach(k => {
      g[k] = Math.random() < .5 ? a.genes[k] : b.genes[k];
      if (Math.random() < MUT_RATE) g[k] = GENES[k].mut[pickFamily(bias)];
    });
    if (forceMutation && rarityOf(g) === 'comun') {
      const k = pick(GENE_KEYS);
      g[k] = GENES[k].mut[Math.random() < .6 ? 'elegante' : 'egipcio'];
    }
    return g;
  }
  function randomStatueGenes(fav) {
    const g = {};
    GENE_KEYS.forEach(k => { g[k] = pick(GENES[k].common); });
    if (Math.random() < .12) { const k = pick(GENE_KEYS); g[k] = GENES[k].mut[pickFamily(fav ? { [fav]: 2.4 } : null)]; }
    return g;
  }

  // ================= Dibujo de gatos por capas (provisional, luego se reemplaza por arte IA) =================
  let uid = 0;
  const FUR = {
    naranja: { b: '#f39a4a' }, gris: { b: '#9aa4b2' }, negro: { b: '#3d3846' }, blanco: { b: '#f6f1e9' }, crema: { b: '#f1d9ab' }, cafe: { b: '#9c6b45' },
    plateado: { b: '#d3dae6', g: ['#f7f9fc', '#a9b5ca'] }, dorado: { b: '#f2c14e', g: ['#ffe48d', '#d68e17'] },
    cosmico: { b: '#5a48d6', g: ['#8a67ff', '#1f6fd1'] }, arena: { b: '#e2bf7e', g: ['#f2d79f', '#c7954c'] },
    nevado: { b: '#eef6fb', g: ['#ffffff', '#bcdcf0'] },
  };
  const IRIS = { verde: '#69c34d', ambar: '#f0a32e', azul: '#4aa9ec', kohl: '#e8b33a', hielo: '#7fdcff' };
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const t = f < 0 ? 0 : 255, p = Math.abs(f);
    r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }
  const lum = hex => { const n = parseInt(hex.slice(1), 16); return (.3 * (n >> 16) + .59 * ((n >> 8) & 255) + .11 * (n & 255)) / 255; };
  const flake = (x, y, r, c) => `<path d="M${x - r} ${y}h${2 * r}M${x - r / 2} ${y - r * .87}l${r} ${r * 1.73}M${x + r / 2} ${y - r * .87}l${-r} ${r * 1.73}" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/>`;
  function star4(x, y, r, fill) {
    return `<path d="M${x} ${y - r} Q${x + r * .22} ${y - r * .22} ${x + r} ${y} Q${x + r * .22} ${y + r * .22} ${x} ${y + r} Q${x - r * .22} ${y + r * .22} ${x - r} ${y} Q${x - r * .22} ${y - r * .22} ${x} ${y - r}Z" fill="${fill}"/>`;
  }

  function catSVG(g, o = {}) {
    if (g.acc !== 'nemes') { const u = catArtURL(g, o.pose || 'frente', !!o.statue); if (u) return `<img class="cat catimg${o.cracks ? ' cracked' : ''}" src="${u}" alt="">`; }
    const id = 'k' + (++uid), st = !!o.statue;
    const F = FUR[g.fur] || FUR.naranja;
    const P = st
      ? { fur: '#cdb488', body: '#cdb488', dark: '#a98f62', white: '#dcc8a0', ink: '#6b5634', ear: '#b89c6c', nose: '#a98f62', gold: '#b39a6c', star: '#a98f62', red: '#a98f62', blue: '#b39a6c', turq: '#c2a878', frost: '#a98f62' }
      : { fur: F.g ? `url(#${id}f)` : F.b, body: F.g ? `url(#${id}f)` : F.b, dark: lum(F.b) < .3 ? shade(F.b, .3) : shade(F.b, -.3), white: '#fbf6ee', ink: '#2a1f35', ear: '#f6a5b6', nose: '#ef7f98', gold: '#f4c24f', star: '#fff6c4', red: '#d94848', blue: '#1f5fbf', turq: '#36cbb9', frost: '#4fa9e0' };
    let defs = '';
    if (!st && F.g) defs += `<linearGradient id="${id}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${F.g[0]}"/><stop offset="1" stop-color="${F.g[1]}"/></linearGradient>`;
    const S = `stroke="${P.ink}" stroke-width="3" stroke-linejoin="round"`;
    const pat = g.pat;
    const smoking = pat === 'smoking';
    let o2 = '';

    // cola
    o2 += `<path d="M146 176C192 172 194 116 168 106C158 102 152 112 160 117C176 127 172 158 142 160Z" fill="${smoking && !st ? '#2b2731' : P.fur}" ${S}/>`;
    // cuerpo
    o2 += `<ellipse cx="100" cy="150" rx="50" ry="46" fill="${smoking && !st ? '#2b2731' : P.body}" ${S}/>`;
    if (pat === 'atigrado') o2 += `<path d="M58 138q12 4 14 16M55 156q12 2 14 13M142 138q-12 4-14 16M145 156q-12 2-14 13" stroke="${P.dark}" stroke-width="5" stroke-linecap="round" fill="none"/>`;
    if (pat === 'manchas') o2 += [[74, 142, 9], [128, 160, 11], [112, 130, 6], [86, 170, 7]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${P.dark}"/>`).join('');

  function catArtURL(g, pose, statue) {

    const stars = Array.from({ length: 6 }, () => [.15 + rnd() * .7, .5 + rnd() * .42]); // en el cuerpo, no en la cara

        html += objHTML('statue', { ...sp, w: .16 }, `<span class="tag">Despertar · ${COST.awaken}</span>${catSVG(c.genes, { statue: true })}`, 'Estatua dormida: toca para despertarla', `data-statue="${c.id}"`);
      });
    }
    if (S.hab === 'egipto' && (artURL('fondo_egipto_' + mode) || artURL('fondo_egipto_dia'))) {
      if (S.up && S.up.obeliscos) DECO.ob.xs.forEach(x => { html += `<div class="obj" aria-hidden="true" style="left:${x * 100}%;top:${DECO.ob.y * 100}%;width:${DECO.ob.w * 100}%;z-index:2">${obeliskArt()}</div>`; });
      if (S.up && S.up.estandartes) DECO.ban.xs.forEach(x => { html += `<div class="obj" aria-hidden="true" style="left:${x * 100}%;top:${DECO.ban.y * 100}%;width:${DECO.ban.w * 100}%;z-index:2">${bannerArt()}</div>`; });
    }
    if (S.hab === 'egipto' && S.up && S.up.estanque) html += `<div class="obj pond" aria-hidden="true" style="left:${DECO.pond.x * 100}%;top:${DECO.pond.y * 100}%;width:${DECO.pond.w * 100}%;z-index:5">${artURL('estanque') ? `<img src="${artURL('estanque')}" alt="">` : `<svg viewBox="0 0 120 40"><ellipse cx="60" cy="22" rx="58" ry="17" fill="#c9a66b"/><ellipse cx="60" cy="21" rx="52" ry="14" fill="#3d93d6"/><path d="M26 18h14M70 26h18" stroke="#bfe6ff" stroke-width="2" stroke-linecap="round" opacity=".7"/><ellipse cx="44" cy="24" rx="9" ry="4" fill="#3f9b5a"/><ellipse cx="84" cy="16" rx="8" ry="3.5" fill="#3f9b5a"/><path d="M44 22c-4-2-5-7-3-10c2 2 3 5 3 10zm0 0c4-2 5-7 3-10c-2 2-3 5-3 10z" fill="#ec6fd8"/></svg>`}</div>`;
    world.innerHTML = html;
    $('obj-sphinx').addEventListener('click', () => {
      ensureAudio();
      if (!S.sphinxAwake) { wakeSphinx(); return; }
      S.tip++; sfx.meow(); tickTemplo();
    });
    if (S.sphinxAwake) {
      world.querySelectorAll('[data-slot]').forEach(b => b.addEventListener('click', () => {
        const i = Number(b.dataset.slot);
        if (slotsOf()[i]) openSlot(i); else openBreed();
      }));
      $('obj-altar').addEventListener('click', collectAltar);
      world.querySelectorAll('[data-statue]').forEach(b => b.addEventListener('click', () => openCat(Number(b.dataset.statue))));
    }
    // Gatos despiertos caminando
    const awake = S.cats.filter(c => c.awake && c.hab === S.hab).slice(-maxWalkers());
    const ids = new Set(awake.map(c => c.id));
    [...walkers.keys()].forEach(id => { if (!ids.has(id)) walkers.delete(id); });
    const now = performance.now();
    awake.forEach(c => {
      let w = walkers.get(c.id);
      if (!w) {
        const sp = spawnAt[c.id];
        const x = sp ? sp.x : FLOOR.x0 + Math.random() * (FLOOR.x1 - FLOOR.x0);
        const y = sp ? sp.y : FLOOR.y0 + Math.random() * (FLOOR.y1 - FLOOR.y0);
        w = { x, y, tx: x, ty: y, walking: false, until: now + (sp ? 900 : Math.random() * 2500), face: Math.random() < .5 ? -1 : 1 };
        delete spawnAt[c.id];
        walkers.set(c.id, w);
      }
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'walker' + (w.walking ? ' walking' : '');
      b.dataset.cat = c.id;
      b.setAttribute('aria-label', `${c.name}: tócalo para acariciarlo, mantén presionado para levantarlo`);
      b.innerHTML = `<div class="flip"><div class="side">${catSideSVG(c.genes)}</div><div class="front">${catSVG(c.genes)}</div></div><div class="hang">${catHangSVG(c.genes)}</div><span class="emote" aria-hidden="true"></span>`;
      b.addEventListener('pointerdown', e => { if (w.walking) setIdle(w, performance.now()); walkerDown(e, w, c); });
      b.addEventListener('click', e => { if (e.detail === 0) openCat(c.id); }); // con teclado, Enter abre la ficha
      w.el = b; w.flip = b.firstChild; w.genes = c.genes;
      world.appendChild(b);
    });
    placeWalkers();
  }

  // ================= Cariño, caricias y levantar gatos del pellejito =================
  const LOVE_DECAY_MS = 20 * 60 * 1000;   // el cariño baja 1 punto cada 20 minutos
  const LOVE_BONUS_AT = 80;                // con 80 o más, +1 carga del poder en los minijuegos
  function loveOf(c) {
    const base = c.love === undefined ? 50 : c.love;
    const lost = c.loveAt ? Math.floor((Date.now() - c.loveAt) / LOVE_DECAY_MS) : 0;
    return Math.max(0, Math.min(100, base - lost));
  }
  function addLove(c, n) {
    const v = Math.min(100, loveOf(c) + n);
    c.love = v; c.loveAt = Date.now();
    if (v >= 100 && !c.adored) { c.adored = true; setTimeout(() => elderSay(`¡${c.name} te adora! Con tanto cariño juega mejor en los minijuegos.`), 400); }
    save();
    return v;
  }
  function petLove(c) {
    const now = Date.now(), quick = now - (c.petAt || 0) < 3000;
    c.petAt = now;
    return addLove(c, quick ? 1 : 4);
  }

  function petCat(w, c) {
    emote(w, '♥'); sfx.purr(); buzz(8);
    const v = petLove(c);
    showChip(w, c, v);
  }
  function showChip(w, c, v) {
    if (!w.el) return;
    let chip = w.el.querySelector('.namechip');
    if (!chip) { chip = document.createElement('span'); chip.className = 'namechip'; w.el.appendChild(chip); }
    chip.innerHTML = `${esc(c.name)} <span class="hearts">♥ ${v}</span><button type="button" data-ficha="${c.id}">Ficha</button>`;
    chip.querySelector('button').addEventListener('click', e => { e.stopPropagation(); openCat(c.id); });
    clearTimeout(w.chipTimer);
    w.chipTimer = setTimeout(() => chip.remove(), 3200);
  }

  let lift = null;   // { w, c, sx, sy, lifted, timer }
  function walkerDown(e, w, c) {
    if (lift || e.button > 0 || e.target.closest('.namechip')) return;
    ensureAudio();
    lift = { w, c, sx: e.clientX, sy: e.clientY, lifted: false };
    lift.timer = setTimeout(() => { if (lift && !lift.lifted) startLift(lift.sx, lift.sy); }, 280);
    addEventListener('pointermove', walkerMove);
    addEventListener('pointerup', walkerUp);
    addEventListener('pointercancel', walkerUp);
    e.preventDefault();
  }
  function walkerMove(e) {
    if (!lift) return;
    if (!lift.lifted) {
      if (Math.hypot(e.clientX - lift.sx, e.clientY - lift.sy) < 10) return;
      startLift(e.clientX, e.clientY);
    }
    moveLift(e.clientX, e.clientY);
  }
  function walkerUp(e) {
    removeEventListener('pointermove', walkerMove);
    removeEventListener('pointerup', walkerUp);
    removeEventListener('pointercancel', walkerUp);
    if (!lift) return;
    clearTimeout(lift.timer);
    const L = lift; lift = null;
    if (!L.lifted) { if (e.type !== 'pointercancel') petCat(L.w, L.c); return; }
    dropCat(L, e.clientX, e.clientY);
  }
  function startLift(x, y) {
    const w = lift.w, world = $('world');
    lift.lifted = true;
    w.lifted = true; w.walking = false;
    w.el.classList.remove('walking', 'land'); w.el.classList.add('lifted');
    const chip = w.el.querySelector('.namechip'); if (chip) chip.remove();
    w.liftW = world.clientWidth * .22;
    $('lift-layer').appendChild(w.el);
    sfx.mrrp(); buzz(15);
    moveLift(x, y);
  }
  function moveLift(x, y) {
    const w = lift.w;
    w.el.style.width = w.liftW + 'px';
    w.el.style.zIndex = 1;
    w.el.style.transform = `translate3d(${x}px,${y}px,0) translate(-50%,-6%)`;
    w.flip.style.transform = 'none';
  }
  function dropCat(L, x, y) {
    const w = L.w, c = L.c, world = $('world');
    const under = document.elementFromPoint(x, y);
    const habBtn = under && under.closest('[data-hab]');
    const slotBtn = under && under.closest('[data-slot]');
    const feeder = under && under.closest('#obj-altar');
    const otherEl = under && under.closest('.walker');
    w.lifted = false;
    w.el.classList.remove('lifted');
    if (!world) return;
    world.appendChild(w.el);
    const r = world.getBoundingClientRect();
    w.x = Math.max(FLOOR.x0, Math.min(FLOOR.x1, (x - r.left) / r.width));
    w.y = Math.max(FLOOR.y0, Math.min(FLOOR.y1, (y - r.top) / r.height + .12));
    w.tx = w.x; w.ty = w.y; w.until = performance.now() + 1400;
    placeWalkers();
    w.el.classList.remove('land'); void w.el.offsetWidth; w.el.classList.add('land');
    const dust = document.createElement('i');
    dust.className = 'dust'; dust.style.left = (w.x * 100) + '%'; dust.style.top = (w.y * 100) + '%';
    world.appendChild(dust); setTimeout(() => dust.remove(), 600);
    sfx.thump(); buzz(12);
    if (habBtn) {
      const to = habBtn.dataset.hab;
      if (to === c.hab) return;
      if (!S.habs[to].open) { toast(`${HABITATS[to].short} todavía está cerrado. Ábrelo con piedra.`); return; }
      c.hab = to; walkers.delete(c.id); save(); renderTemplo(); renderGatos();
      toast(`${c.name} se mudó a ${HABITATS[to].short}.`);
      return;
    }
    if (slotBtn) {
      const i = Number(slotBtn.dataset.slot);
      if (slotsOf()[i]) { toast(`Ese ${HABITATS[S.hab].nest.toLowerCase()} está ocupado.`); return; }
      picked = [c.id]; openBreed();
      return;
    }
    if (feeder) {
      const now = Date.now();
      if (now - (c.fedAt || 0) < 60000) { emote(w, '…'); toast(`${c.name} ya comió hace un momento.`); return; }
      c.fedAt = now; const v = addLove(c, 8);
      emote(w, '♥'); sfx.purr(); showChip(w, c, v);
      toast(`${c.name} comió en el ${HABITATS[S.hab].feeder.toLowerCase()}. ¡Ñam!`);
      return;
    }
    if (otherEl && otherEl !== w.el) {
      const o = S.cats.find(k => k.id === Number(otherEl.dataset.cat)), ow = o && walkers.get(o.id);
      if (!o || !ow) return;
      const now = Date.now(), tired = now - (c.mateAt || 0) < 30000;
      c.mateAt = now;
      addLove(c, tired ? 1 : 5); addLove(o, tired ? 1 : 5);
      emote(w, '♪'); setTimeout(() => emote(ow, '♥'), 250);
      sfx.meow(); setTimeout(() => sfx.purr(), 300);
      toast(`${c.name} y ${o.name} se pusieron a jugar.`);
    }
  }

  // Acciones de la ficha
  function catActions(c) {
    const v = loveOf(c);
    return `<div class="love"><div class="love-top"><b>Cariño</b><span id="love-num">♥ ${v}</span></div>
      <div class="bar"><i id="love-bar" style="width:${v}%"></i></div>
      <small>${v >= LOVE_BONUS_AT ? `Con tanto cariño lleva +1 carga de su poder a los minijuegos.` : `Con ${LOVE_BONUS_AT} o más lleva +1 carga de su poder a los minijuegos.`}</small></div>
      <div class="cat-acts">
        <button class="btn" data-act="pet" type="button">Acariciar</button>
        <button class="btn" data-act="treat" type="button">Premio · 1</button>
        <button class="btn" data-act="play" type="button">Jugar</button>
      </div>`;
  }
  function bindCatActions(c) {
    document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
      ensureAudio();
      const act = b.dataset.act, now = Date.now();
      let v, mark = '♥';
      if (act === 'pet') { v = petLove(c); sfx.purr(); }
      if (act === 'treat') {
        if (S.ofrendas < 1) { toast('No tienes ofrendas para el premio.'); return; }
        setOfrendas(-1); v = addLove(c, 12); sfx.coin(); setTimeout(() => sfx.meow(), 200); mark = '★';
      }
      if (act === 'play') {
        const wait = 120000 - (now - (c.playAt || 0));
        if (wait > 0) { toast(`${c.name} está cansado de jugar. Vuelve en ${fmt(Math.ceil(wait / 1000))}.`); return; }
        c.playAt = now; v = addLove(c, 8); sfx.meow(); mark = '♪';
      }
      buzz(10);
      $('love-num').textContent = `♥ ${v}`; $('love-bar').style.width = v + '%';
      const hero = document.querySelector('.sheet-card .hero');
      if (hero) { const h = document.createElement('span'); h.className = 'hero-heart'; h.textContent = mark; hero.appendChild(h); setTimeout(() => h.remove(), 1200); }
      if (act === 'play' && hero) { hero.classList.remove('playing'); void hero.offsetWidth; hero.classList.add('playing'); }
    }));
  }
  function startRename(c) {
    const h = $('cat-title');
    h.innerHTML = `<input id="name-in" maxlength="14" value="${esc(c.name)}" aria-label="Nombre del gato"><button class="btn gold" id="name-ok" type="button">Guardar</button>`;
    const inp = $('name-in'); inp.focus(); inp.select();
    const done = () => {
      const v = inp.value.trim().slice(0, 14);
      if (v && v !== c.name) { c.name = v; save(); renderGatos(); renderTemplo(); toast(`Ahora se llama ${v}.`); }
      openCat(c.id);
    };
    $('name-ok').addEventListener('click', done);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(); if (e.key === 'Escape') openCat(c.id); });
  }

  function emote(w, ch) {
    const e = w.el && w.el.querySelector('.emote'); if (!e) return;
    e.textContent = ch; e.classList.remove('on'); void e.offsetWidth; e.classList.add('on');
  }
  function setIdle(w, t) {
    w.walking = false; w.el && w.el.classList.remove('walking');
    w.until = t + 2000 + Math.random() * 5000;
    let pose = 'frente';
    if (w.genes && artURL('gato_frente')) {
      pose = Math.random() < .45 ? 'frente' : pick(IDLE_POSES);
      const u = catArtURL(w.genes, pose, false) || catArtURL(w.genes, 'frente', false);
      const im = w.el && w.el.querySelector('.front img');
      if (im && u) im.src = u;
      if (pose === 'dormido') { w.until += 4000; emote(w, 'z'); return; }
    }
    if (Math.random() < .3) emote(w, pick(['♥', 'z', '♪', '✦', '…']));
  }
  function setWalk(w) {
    if (reduceMotion) { w.until = Infinity; return; }
    w.tx = FLOOR.x0 + Math.random() * (FLOOR.x1 - FLOOR.x0);
    w.ty = FLOOR.y0 + Math.random() * (FLOOR.y1 - FLOOR.y0);
    w.walking = true; w.el && w.el.classList.add('walking');
  }
  function placeWalkers() {
    const world = $('world'); if (!world) return;
    const W = world.clientWidth, H = world.clientHeight;
    for (const w of walkers.values()) {
      if (!w.el || w.lifted) continue;
      w.el.style.width = (W * .2) + 'px';
      w.el.style.transform = `translate3d(${w.x * W}px,${w.y * H}px,0) translate(-50%,-100%) scale(${depth(w.y)})`;
      w.el.style.zIndex = Math.round(w.y * 1000);
      w.flip.style.transform = `scaleX(${w.face})`;
    }
  }
  let lastT = 0;
  function walkLoop(t) {
    const dt = Math.min(.05, (t - lastT) / 1000 || 0); lastT = t;
    const world = $('world');
    if (world && !$('tab-templo').hidden && world.clientWidth) {
      const W = world.clientWidth, H = world.clientHeight;
      for (const w of walkers.values()) {
        if (!w.el || !w.el.isConnected || w.lifted) continue;
        if (w.walking) {
          const dx = (w.tx - w.x) * W, dy = (w.ty - w.y) * H, d = Math.hypot(dx, dy);
          const stepPx = W * .07 * depth(w.y) * dt;
          if (d <= stepPx) { w.x = w.tx; w.y = w.ty; setIdle(w, t); }
          else { w.x += dx / d * stepPx / W; w.y += dy / d * stepPx / H; if (Math.abs(dx) > 2) w.face = dx < 0 ? -1 : 1; }
        } else if (t > w.until) setWalk(w);
      }
      placeWalkers();
    }
    requestAnimationFrame(walkLoop);
  }

  function tickTemplo() {
    const gt = $('guide-text'); if (!gt || $('tab-templo').hidden) return;
    if (!S.sphinxAwake) {
      gt.textContent = 'Soy el Abuelo Colmillo. Este templo lleva siglos dormido: toca la esfinge para despertarla.';
      return;
    }
    const t = guideText(); if (gt.textContent !== t) gt.textContent = t;
    const a = altarAmount();
    const at = $('altar-tag'); if (at) at.textContent = a ? `+${a}${a >= ALTAR.cap ? ' · lleno' : ''}` : '';
    const fl = $('altar-flame'); if (fl) fl.style.transform = `scale(${(.55 + .6 * a / ALTAR.cap).toFixed(2)})`;
    slotsOf().forEach((s, i) => {
      const tag = $('sarc-tag-' + i), obj = document.querySelector(`[data-slot="${i}"]`);
      if (!tag || !obj) return;
      if (!s) { tag.textContent = '+ Criar'; tag.className = 'tag'; obj.className = 'obj sarc-obj empty'; obj.style.removeProperty('--glow'); return; }
      const left = Math.max(0, Math.ceil((s.readyAt - Date.now()) / 1000));
      tag.textContent = left ? fmt(left) : '¡Listo!';
      tag.className = left ? 'tag' : 'tag gold';
      obj.className = 'obj sarc-obj' + (left ? '' : ' ready');
      const glow = { comun: 'transparent', raro: '#36cbb9', epico: '#b48cff', legend: '#f4c24f' }[s.rarity];
      obj.style.setProperty('--glow', glow);
    });
  }

  function renderGatos() {
    const el = $('tab-gatos');
    const cats = [...S.cats].sort((a, b) => (a.awake === b.awake ? b.id - a.id : a.awake ? 1 : -1));
    const fams = Object.keys(FAMILY).map(f => {
      const muts = GENE_KEYS.map(k => ({ k, v: GENES[k].mut[f] }));

        muts.map(m => S.found.includes(m.v) ? `<li>${NAMES_OF[m.v]}<small>${GENES[m.k].label}</small></li>` : `<li class="no">???<small>${GENES[m.k].label}</small></li>`).join('')
      }</ul></div>`;
    }).join('');
    el.innerHTML = `
      <div class="block"><h2>Tus gatos <span style="color:var(--muted);font-size:1rem">(${S.cats.filter(c => c.awake).length} despiertos)</span></h2>
        <div class="grid">${cats.map(cardHTML).join('') || '<p class="note">Aún no tienes gatos.</p>'}</div>
      </div>
      <div class="block"><h2>Libro de mutaciones</h2><div class="book">${fams}</div></div>
      <button class="reset" id="btn-reset" type="button">Borrar mi progreso</button>`;
    el.querySelectorAll('[data-cat]').forEach(b => b.addEventListener('click', () => openCat(Number(b.dataset.cat))));
    let armed = false;
    $('btn-reset').addEventListener('click', e => {
      if (!armed) { armed = true; e.currentTarget.classList.add('confirm'); e.currentTarget.textContent = 'Toca otra vez para borrar todo'; return; }
      S = freshState(); save(); $('ofr').textContent = 0; $('stone').textContent = 0; showTab('templo'); renderAll();
    });
    $('dot-gatos').hidden = !S.cats.some(c => !c.awake);
  }
  function cardHTML(c) {
    if (!c.awake) return `<button class="card stone" data-cat="${c.id}" type="button">
      <div class="art">${catSVG(c.genes, { statue: true })}</div>
      <span class="name">Estatua</span><span class="meta">Toca para despertar · ${COST.awaken}</span></button>`;
    const r = rarityOf(c.genes);

      <div class="art">${catSVG(c.genes)}</div>
      <span class="name">${esc(c.name)}</span><span class="meta">${badge(r)} ${styleOf(c.genes)} · ${HABITATS[c.hab || 'egipto'].short}</span></button>`;
  }

  function genesHTML(g) {
    return `<ul class="genes">${GENE_KEYS.map(k => {
      const f = MUT_FAMILY[g[k]];
      return `<li class="${f ? 'mut' : ''}" style="${f ? `--fc:${FAMILY[f].color}` : ''}"><span>${GENES[k].label}</span><b>${NAMES_OF[g[k]]}${f ? ` · ${FAMILY[f].label}` : ''}</b></li>`;
    }).join('')}</ul>`;
  }

  // ================= Acciones =================
  function wakeSphinx() {
    ensureAudio();
    const art = $('sphinx-art');

    art.innerHTML = sphinxArt(true, true);

      setTimeout(() => {
        S.sphinxAwake = true;

        addCat({ fur: 'negro', pat: 'liso', eyes: 'verde', acc: 'ninguno' });

          <div class="big-name">¡Despertaste a la Esfinge!</div>

  function collectAltar() {
    ensureAudio();

  let picked = [];
  function openBreed() {

  }
  function drawBreed() {

      <p class="note">El gatito hereda rasgos de los dos y puede salir con mutaciones nuevas. En ${HABITATS[S.hab].short} salen más mutaciones <b style="color:${FAMILY[habFam()].color}">${famPlural(habFam())}</b>.</p>
      <button class="btn turq" id="do-breed" type="button" ${can ? '' : 'disabled'}>${!A || !B ? 'Elige 2 gatos' : S.ofrendas < COST.breed ? `Te faltan ${COST.breed - S.ofrendas} ofrendas` : `Al ${HABITATS[S.hab].nest.toLowerCase()} · ${COST.breed}`}</button>`);
    $('x').addEventListener('click', closeSheet);
    document.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {

    }));

      picked = [];
      save(); closeSheet(); showTab('templo');

  function openSlot(i) {
    ensureAudio();
    const s = slotsOf()[i]; if (!s) return;
    const left = Math.ceil((s.readyAt - Date.now()) / 1000);
    if (left > 0) { toast(`Faltan ${fmt(left)} para que despierte.`); return; }
    openSheet(`<div class="center"><div class="hero waking" style="width:140px">${nestArt(S.hab)}</div><div class="big-name">Abriendo…</div></div>`);
    sfx.rumble(); buzz([30, 50, 30, 50, 30]);
    setTimeout(() => {
      slotsOf()[i] = null;
      const c = addCat(s.genes, { awake: true, gen: s.gen, parents: s.names, hab: S.hab });
      spawnAt[c.id] = { x: SPOTS.sarc[i].x, y: FLOOR.y0 + .02 };

  }

  // ================= Motor de Ofrendas (match-3), sin DOM para poder probarlo =================
  // Pieza = { k: tipo 0..4 (−1 = hierba gatera), sp: null | 'h' (fila) | 'v' (columna) | 'b' (explosión 3×3) | 'r' (hierba gatera) }
  const MN = 8, NK = 5;
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function findGroups(g) {
    const runs = [];
    for (let r = 0; r < MN; r++) {
      let c = 0;
      while (c < MN) {
        const t = g[r * MN + c];
        if (!t || t.k < 0) { c++; continue; }
        let e = c + 1;
        while (e < MN && g[r * MN + e] && g[r * MN + e].k === t.k) e++;
        if (e - c >= 3) runs.push({ dir: 'h', k: t.k, cells: Array.from({ length: e - c }, (_, i) => r * MN + c + i) });
        c = e;
      }
    }
    for (let c = 0; c < MN; c++) {
      let r = 0;
      while (r < MN) {
        const t = g[r * MN + c];
        if (!t || t.k < 0) { r++; continue; }
        let e = r + 1;
        while (e < MN && g[e * MN + c] && g[e * MN + c].k === t.k) e++;
        if (e - r >= 3) runs.push({ dir: 'v', k: t.k, cells: Array.from({ length: e - r }, (_, i) => (r + i) * MN + c) });
        r = e;
      }
    }
    const groups = [], owner = new Map();
    for (const run of runs) {
      let gp = null;
      for (const i of run.cells) if (owner.has(i)) { gp = owner.get(i); break; }
      if (!gp) { gp = { k: run.k, cells: new Set(), runs: [] }; groups.push(gp); }
      gp.runs.push(run);
      run.cells.forEach(i => { gp.cells.add(i); owner.set(i, gp); });
    }
    return groups;
  }

  function specialFor(gp) {
    const maxLen = Math.max(...gp.runs.map(r => r.cells.length));
    const hasH = gp.runs.some(r => r.dir === 'h'), hasV = gp.runs.some(r => r.dir === 'v');
    if (maxLen >= 5) return 'r';
    if (hasH && hasV) return 'b';
    if (maxLen === 4) return gp.runs.find(r => r.cells.length === 4).dir;
    return null;
  }

  function mostCommonKind(g) {
    const n = new Array(NK).fill(0);
    g.forEach(t => { if (t && t.k >= 0) n[t.k]++; });
    return n.indexOf(Math.max(...n));
  }

  function hasMatchAfterSwap(g, a, b) {
    const t = g[a]; g[a] = g[b]; g[b] = t;
    const ok = findGroups(g).length > 0;
    g[b] = g[a]; g[a] = t;
    return ok;
  }
  function validMoves(g) {
    const out = [];
    for (let i = 0; i < MN * MN; i++) {
      const r = Math.floor(i / MN), c = i % MN;
      for (const j of [c + 1 < MN ? i + 1 : -1, r + 1 < MN ? i + MN : -1]) {
        if (j < 0 || !g[i] || !g[j]) continue;
        if (g[i].sp === 'r' || g[j].sp === 'r' || (g[i].sp && g[j].sp) || hasMatchAfterSwap(g, i, j)) out.push([i, j]);
      }
    }
    return out;
  }

  function newGrid(rng) {
    for (;;) {
      const g = new Array(MN * MN).fill(null);
      for (let i = 0; i < MN * MN; i++) {
        const r = Math.floor(i / MN), c = i % MN;
        let k;
        do { k = Math.floor(rng() * NK); }
        while ((c >= 2 && g[i - 1].k === k && g[i - 2].k === k) || (r >= 2 && g[i - MN].k === k && g[i - 2 * MN].k === k));
        g[i] = { k, sp: null };
      }
      if (validMoves(g).length) return g;
    }
  }

  function shuffleGrid(g, rng) {
    const tiles = g.filter(Boolean);
    for (let tries = 0; tries < 200; tries++) {
      for (let i = tiles.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [tiles[i], tiles[j]] = [tiles[j], tiles[i]]; }
      tiles.forEach((t, i) => { g[i] = t; });
      if (!findGroups(g).length && validMoves(g).length) return true;
    }
    const fresh = newGrid(rng); fresh.forEach((t, i) => { g[i] = t; });
    return true;
  }

  // Intenta un intercambio. Devuelve null si no hace nada, o el primer paso de la jugada.
  function trySwap(g, a, b) {
    const A = g[a], B = g[b];
    if (!A || !B) return null;
    if (A.sp === 'r' || B.sp === 'r') {
      g[a] = B; g[b] = A;
      if (A.sp === 'r' && B.sp === 'r') return { forced: new Set(g.map((_, i) => i)) };
      const ri = A.sp === 'r' ? b : a;
      g[ri]._target = (A.sp === 'r' ? B : A).k;
      return { forced: new Set([ri]) };
    }
    g[a] = B; g[b] = A;
    if (A.sp && B.sp) return { forced: new Set([a, b]) };
    if (findGroups(g).length) return { swapPair: [a, b] };
    g[a] = A; g[b] = B;
    return null;
  }

  // Un paso de cascada: borra grupos (y lo que disparan los especiales), crea especiales, aplica gravedad y rellena.
  function resolveStep(g, rng, swapPair, forced) {
    const groups = forced ? [] : findGroups(g);
    if (!groups.length && !forced) return null;
    const clear = new Set(forced || []);
    const created = [];
    for (const gp of groups) {
      const sp = specialFor(gp);
      let pivot = null;
      if (sp) {
        pivot = swapPair ? swapPair.find(i => gp.cells.has(i)) : undefined;
        if (pivot === undefined) {
          if (sp === 'b') {
            const hCells = new Set(gp.runs.filter(r => r.dir === 'h').flatMap(r => r.cells));
            pivot = gp.runs.filter(r => r.dir === 'v').flatMap(r => r.cells).find(i => hCells.has(i));
          }
          if (pivot === undefined) {
            const run = gp.runs.reduce((a, b) => (b.cells.length > a.cells.length ? b : a));
            pivot = run.cells[Math.floor(run.cells.length / 2)];
          }
        }
        created.push({ i: pivot, k: sp === 'r' ? -1 : gp.k, sp, was: g[pivot] ? g[pivot].k : gp.k });
      }
      gp.cells.forEach(i => { if (i !== pivot) clear.add(i); });
    }
    const createdAt = new Set(created.map(c => c.i));
    const queue = [...clear], fired = [];
    while (queue.length) {
      const i = queue.pop(), t = g[i];
      if (!t || !t.sp || t._fired) continue;
      t._fired = true;
      fired.push({ i, sp: t.sp });
      const r = Math.floor(i / MN), c = i % MN, area = [];
      if (t.sp === 'h') for (let x = 0; x < MN; x++) area.push(r * MN + x);
      if (t.sp === 'v') for (let y = 0; y < MN; y++) area.push(y * MN + c);
      if (t.sp === 'b') for (let y = r - 1; y <= r + 1; y++) for (let x = c - 1; x <= c + 1; x++) if (y >= 0 && y < MN && x >= 0 && x < MN) area.push(y * MN + x);
      if (t.sp === 'r') { const kk = t._target !== undefined ? t._target : mostCommonKind(g); g.forEach((u, j) => { if (u && u.k === kk) area.push(j); }); }
      for (const j of area) if (!clear.has(j) && !createdAt.has(j)) { clear.add(j); queue.push(j); }
    }
    const cleared = [...clear].filter(i => g[i]).map(i => ({ i, k: g[i].k, sp: g[i].sp }));
    for (const i of clear) g[i] = null;
    for (const cr of created) g[cr.i] = { k: cr.k, sp: cr.sp };
    const moves = [], spawns = [];
    for (let c = 0; c < MN; c++) {
      let w = MN - 1;
      for (let r = MN - 1; r >= 0; r--) {
        const i = r * MN + c;
        if (g[i]) { if (r !== w) { g[w * MN + c] = g[i]; g[i] = null; moves.push({ from: i, to: w * MN + c }); } w--; }
      }
      const gap = w + 1;
      for (let r = w; r >= 0; r--) { g[r * MN + c] = { k: Math.floor(rng() * NK), sp: null }; spawns.push({ i: r * MN + c, drop: gap }); }
    }
    return { cleared, created, fired, moves, spawns };
  }

  // Niveles generados: metas "junta piezas" o "limpia la arena" (cada 3er nivel)
  const SAND_SHAPES = [
    (r, c) => r >= 2 && r <= 5 && c >= 2 && c <= 5,
    (r, c) => r === c || r + c === MN - 1,
    (r, c) => r >= 5,
    (r, c) => r === 0 || r === MN - 1 || c === 0 || c === MN - 1,
    (r, c) => (r + c) % 2 === 0 && r >= 1 && r <= 6,
  ];
  function levelDef(n) {
    const rng = mulberry32(n * 9301 + 49297);
    const moves = Math.max(16, 24 - Math.floor(n / 2));
    if (n >= 3 && n % 3 === 0) {
      const f = SAND_SHAPES[(n / 3 - 1) % SAND_SHAPES.length];
      const sand = [];
      for (let r = 0; r < MN; r++) for (let c = 0; c < MN; c++) if (f(r, c)) sand.push(r * MN + c);
      return { n, moves: moves + 6, goal: 'sand', sand };
    }
    const kinds = n < 4 ? 1 : 2;
    const picks = [];
    while (picks.length < kinds) { const k = Math.floor(rng() * NK); if (!picks.includes(k)) picks.push(k); }
    const need = {};
    picks.forEach(k => { need[k] = kinds === 1 ? Math.min(30, 12 + 2 * n) : Math.min(32, 10 + 2 * n); });
    return { n, moves, goal: 'collect', need };
  }
  const starsFor = (left, total) => (left / total >= .3 ? 3 : left / total >= .12 ? 2 : 1);

  // ================= Poderes de los gatos (etapa 4) =================
  // Cada gato da un poder según su estilo; las cargas crecen con el número de mutaciones.
  const POWERS = {
    match: {
      caricatura: { key: 'moves', name: 'Ronroneo', desc: '+2 movimientos al empezar' },
      elegante: { key: 'claw', name: 'Zarpazo', desc: 'Rompe la pieza que toques' },
      egipcio: { key: 'ra', name: 'Bendición de Ra', desc: 'Vuelve explosiva la pieza que toques' },
      mistico: { key: 'bastet', name: 'Hierba mágica', desc: 'Convierte la pieza que toques en hierba gatera' },
      artico: { key: 'frost', name: 'Escarcha', desc: 'Congela la pieza que toques: al borrarse, borra su fila' },
    },
    pyr: {
      caricatura: { key: 'reroll', name: 'Cambio', desc: 'Cambia los 3 bloques de abajo' },
      elegante: { key: 'claw', name: 'Zarpazo', desc: 'Quita el bloque que toques' },
      egipcio: { key: 'small', name: 'Cincel', desc: 'Convierte un bloque de abajo en uno de 1×1' },
      mistico: { key: 'sweep', name: 'Barrido estelar', desc: 'Borra la fila y la columna que toques' },
      artico: { key: 'avalanche', name: 'Avalancha', desc: 'Borra los bloques de un cuadro de 3×3 donde toques' },
    },
  };
  const TEAM_MAX = 3;
  function famKey(g) {
    const c = {};
    GENE_KEYS.forEach(k => { const f = MUT_FAMILY[g[k]]; if (f) c[f] = (c[f] || 0) + 1; });
    let best = null;
    ['mistico', 'artico', 'egipcio', 'elegante'].forEach(f => { if (c[f] && (!best || c[f] > c[best])) best = f; });
    return best || 'caricatura';
  }
  function powerOf(cat, game) {
    const fam = famKey(cat.genes), base = POWERS[game][fam];
    const muts = GENE_KEYS.filter(k => MUT_FAMILY[cat.genes[k]]).length;
    const charges = { moves: 2, reroll: 1, claw: 1 + muts, ra: muts, bastet: Math.ceil(muts / 2), small: muts, sweep: Math.ceil(muts / 2), frost: muts, avalanche: muts }[base.key];
    const bonus = loveOf(cat) >= LOVE_BONUS_AT ? 1 : 0;
    return { ...base, charges: charges + bonus, love: !!bonus, catId: cat.id };
  }
  const powerLabel = p => (p.key === 'moves' ? `${p.name} +${p.charges}` : `${p.name} ×${p.charges}`);

  // Elegir equipo antes de jugar
  let teamPick = [];
  function pickTeam(game, start) {
    ensureAudio();
    const awake = S.cats.filter(c => c.awake);
    if (!awake.length) { start([]); return; }
    S.team = S.team || {};
    teamPick = (S.team[game] || []).filter(id => awake.some(c => c.id === id)).slice(0, TEAM_MAX);
    const draw = () => {

    updateMatchHud();
    await wait(240);
    if (!M || !board.isConnected) return;
    st.moves.forEach(m => { const el = M.els[m.from]; M.els[m.to] = el; M.els[m.from] = null; place(el, m.to); });
    st.spawns.forEach(s => { M.els[s.i] = makeTile(M.grid[s.i], s.i, Math.floor(s.i / MN) - s.drop); });
    await wait(260);
  }
  function clearSand(i) {

  function blastFx(f) {

  function finishMatch(win) {

        ${sc ? `<div class="center"><div class="hero" style="width:140px">${catSVG(sc.genes, { statue: true })}</div><b>¡Encontraste una estatua!</b><span class="note">Ya está en tu templo, esperando que la despiertes.</span></div>` : ''}
        <div class="actions"><button class="btn" id="m-home" type="button">Ir al templo</button><button class="btn gold" id="m-next" type="button">Nivel ${n + 1}</button></div>`);

    } else {

      const what = M.def.goal === 'sand' ? `Te faltaron ${M.sand.size} casillas de arena.` : `Te faltaron ${Object.entries(M.left).filter(([, v]) => v > 0).map(([k, v]) => `${v} ${MK[k].plural}`).join(' y ')}.`;
      openSheet(`<div class="center"><div class="big-name">Sin movimientos</div><span class="note">${what} Te llevas 3 ofrendas de consuelo.</span></div>
        <div class="actions"><button class="btn" id="m-home" type="button">Ir al templo</button><button class="btn gold" id="m-retry" type="button">Reintentar</button></div>`);

  function renderJuegos() {
    const n = S.match.level;

    $('tab-juegos').innerHTML = `<div class="block">

        <span class="note" style="text-align:left">Récord: ${S.pyrBest || 0} puntos · tienes ${S.stone || 0} de piedra</span>
