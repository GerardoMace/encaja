    </div>`;
    $('play-match').addEventListener('click', () => pickTeam('match', t => openMatch(S.match.level, t)));
    $('play-pyr').addEventListener('click', () => pickTeam('pyr', openPyramid));
    $('up-from-games').addEventListener('click', openUpgrades);
  }

  // ================= Pirámide (estilo Encaja): bloques de piedra que dan piedra para el templo =================
  const PN = 8;
  const PSHAPE_DEFS = [
    ['X', 3], ['XX', 4], ['X/X', 4], ['XXX', 4], ['X/X/X', 4], ['XXXX', 3], ['X/X/X/X', 3], ['XXXXX', 2], ['X/X/X/X/X', 2],
    ['XX/XX', 5], ['XXX/XXX/XXX', 2],
    ['XX/X.', 3], ['XX/.X', 3], ['X./XX', 3], ['.X/XX', 3],
    ['X../X../XXX', 2], ['..X/..X/XXX', 2], ['XXX/X../X..', 2], ['XXX/..X/..X', 2],
    ['X./X./XX', 2], ['.X/.X/XX', 2], ['XX/X./X.', 2], ['XX/.X/.X', 2],
    ['XXX/X..', 2], ['XXX/..X', 2], ['X../XXX', 2], ['..X/XXX', 2],
    ['XXX/.X.', 2], ['.X./XXX', 2], ['X./XX/X.', 2], ['.X/XX/.X', 2],
    ['XX./.XX', 2], ['.XX/XX.', 2], ['X./XX/.X', 2], ['.X/XX/X.', 2],
  ];
  const PSHAPES = PSHAPE_DEFS.map(([def, weight]) => {
    const rows = def.split('/'), cells = [];
    rows.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === 'X') cells.push([r, c]); }));
    return { cells, h: rows.length, w: Math.max(...rows.map(x => x.length)), weight };
  });
  const PTOTAL = PSHAPES.reduce((a, s) => a + s.weight, 0);
  const STONES = [
    { base: '#e9cf95', hi: '#f8e7bf', lo: '#c39d5f', mark: '#a8834a' },
    { base: '#d98273', hi: '#f0a99d', lo: '#ad5a4f', mark: '#8c4238' },
    { base: '#3f6fe0', hi: '#8aa6f2', lo: '#2a4fb0', mark: '#f4c24f' },
    { base: '#2fc6a0', hi: '#86e6cc', lo: '#1d9175', mark: '#13664f' },
    { base: '#f4c24f', hi: '#ffe597', lo: '#c58f22', mark: '#946510' },
    { base: '#6b6f8e', hi: '#959ab5', lo: '#474a66', mark: '#30324a' },
  ];
  const STATUE_EVERY = 25;
  function pRandomPiece() {
    let x = Math.random() * PTOTAL, s = 0;
    for (let i = 0; i < PSHAPES.length; i++) { x -= PSHAPES[i].weight; if (x < 0) { s = i; break; } }
    return { s, color: Math.floor(Math.random() * STONES.length) };
  }

  let PG = null;
  const PL = { W: 0, H: 0, pad: 0, cell: 0, tcell: 0, trayY: 0, trayH: 0, ctx: null };

  function pCanPlace(sh, r0, c0) {
    for (const [r, c] of sh.cells) {
      const rr = r0 + r, cc = c0 + c;
      if (rr < 0 || cc < 0 || rr >= PN || cc >= PN || PG.board[rr][cc] >= 0) return false;
    }
    return true;
  }
  function pFits(sh) {
    for (let r = 0; r <= PN - sh.h; r++) for (let c = 0; c <= PN - sh.w; c++) if (pCanPlace(sh, r, c)) return true;
    return false;
  }
  function pDeal() {
    let tray;
    for (let i = 0; i < 15; i++) { tray = [pRandomPiece(), pRandomPiece(), pRandomPiece()]; if (tray.some(p => pFits(PSHAPES[p.s]))) break; }
    PG.tray = tray;
  }
  function pLines(sh, r0, c0) {
    const filled = (r, c) => PG.board[r][c] >= 0 || sh.cells.some(([pr, pc]) => pr + r0 === r && pc + c0 === c);
    const rows = new Set(), cols = new Set();
    for (let r = 0; r < PN; r++) { let ok = true; for (let c = 0; c < PN; c++) if (!filled(r, c)) { ok = false; break; } if (ok) rows.add(r); }
    for (let c = 0; c < PN; c++) { let ok = true; for (let r = 0; r < PN; r++) if (!filled(r, c)) { ok = false; break; } if (ok) cols.add(c); }
    return { rows, cols };
  }

  const PYR_NOTE = `Arrastra los bloques al tablero. Cada fila o columna completa da 1 de piedra; cada ${STATUE_EVERY} líneas en una partida aparece una estatua.`;
  function openPyramid(team) {
    ensureAudio();
    PG = { board: Array.from({ length: PN }, () => Array(PN).fill(-1)), tray: [null, null, null], score: 0, lines: 0, stone: 0, combo: 0, sinceClear: 0,
      over: false, drag: null, clearFx: [], placeFx: [], floats: [], shake: 0, statues: 0, shown: 0, exitArmed: false, stuck: false, target: -1 };
    PG.team = Array.isArray(team) ? team : []; PG.powers = teamPowers(PG.team, 'pyr');
    pDeal();
    ['templo', 'gatos', 'juegos'].forEach(t => { $('tab-' + t).hidden = true; });
    $('tabs').hidden = true;
    const el = $('tab-pyr');
    el.hidden = false;
    el.innerHTML = `
      <div class="mhead">
        <button class="back" id="p-exit" type="button">‹ Salir</button>
        <div class="mtitle"><small>Pirámide</small><strong id="p-score">0</strong></div>
        <div class="mmoves"><b id="p-stone">0</b><small>piedra</small></div>
      </div>
      <div class="mstatus"><span class="mscore">Récord <b>${S.pyrBest || 0}</b></span><span class="mscore" id="p-combo"></span><span class="mscore">Líneas <b id="p-lines">0</b></span></div>
      <div class="powers" id="p-powers" hidden></div>
      <p class="stuck" id="p-stuck" hidden>Ya no cabe ningún bloque. Usa un poder de tus gatos o <button id="p-end" type="button">termina la partida</button>.</p>
      <div class="pwrap" id="p-wrap"><canvas id="p-canvas" aria-label="Tablero de la pirámide: arrastra los bloques de abajo al tablero"></canvas></div>
      <p class="note" id="p-note">${PYR_NOTE}</p>`;
    const cv = $('p-canvas');
    PL.ctx = cv.getContext('2d');
    cv.addEventListener('pointerdown', pDown);
    cv.addEventListener('pointermove', pMove);
    cv.addEventListener('pointerup', pUp);
    cv.addEventListener('pointercancel', () => { if (PG) PG.drag = null; });
    $('p-exit').addEventListener('click', exitPyramid);
    $('p-end').addEventListener('click', () => { if (PG && !PG.over) { PG.over = true; $('p-stuck').hidden = true; pGameOver(false); } });
    renderPyrPowers();
    pLayout();
    window.scrollTo(0, 0);
    requestAnimationFrame(pLoop);
  }
  function exitPyramid() {
    if (!PG) return;
    const btn = $('p-exit');
    if (PG.score > 0 && !PG.over && !PG.exitArmed) {
      PG.exitArmed = true; btn.textContent = '¿Salir? La partida termina'; btn.classList.add('confirm');
      setTimeout(() => { if (PG && btn.isConnected) { PG.exitArmed = false; btn.textContent = '‹ Salir'; btn.classList.remove('confirm'); } }, 2500);
      return;
    }
    if (!PG.over && PG.score > 0) { pGameOver(true); return; }
    closePyramid();
  }
  function closePyramid(tab) {
    PG = null;
    $('tab-pyr').hidden = true; $('tab-pyr').innerHTML = '';
    $('tabs').hidden = false;
    showTab(tab || S.tab || 'juegos');
  }

  function pLayout() {
    const wrap = $('p-wrap'); if (!wrap || !PG) return;
    const avail = Math.max(280, Math.min(wrap.clientWidth, (window.innerHeight - 250) / 1.36));
    const cv = $('p-canvas');
    PL.W = avail; PL.pad = avail * .025; PL.cell = (avail - PL.pad * 2) / PN; PL.tcell = PL.cell * .46;
    PL.trayY = avail + PL.cell * .35; PL.trayH = PL.cell * 2.9; PL.H = PL.trayY + PL.trayH;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.style.width = avail + 'px'; cv.style.height = PL.H + 'px';
    cv.width = Math.round(avail * dpr); cv.height = Math.round(PL.H * dpr);
    PL.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function prr(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawStone(x, y, s, ci, alpha) {
    const ctx = PL.ctx, C = STONES[ci], g = s * .05, r = s * .14;
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    const im = ART[BLOCK_ART[ci]];
    if (im && im.ready) { ctx.drawImage(im.img, x + g * .4, y + g * .4, s - g * .8, s - g * .8); ctx.globalAlpha = 1; return; }
    ctx.fillStyle = C.lo; prr(ctx, x + g, y + g, s - 2 * g, s - 2 * g, r); ctx.fill();
    ctx.fillStyle = C.base; prr(ctx, x + g, y + g, s - 2 * g, s - 2 * g - s * .1, r); ctx.fill();
    ctx.fillStyle = C.hi; prr(ctx, x + g + s * .1, y + g + s * .06, s - 2 * g - s * .2, s * .1, s * .05); ctx.fill();
    ctx.strokeStyle = C.mark; ctx.fillStyle = C.mark; ctx.lineWidth = Math.max(1, s * .06); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const cx = x + s / 2, cy = y + s * .5, u = s * .15;
    ctx.beginPath();
    if (ci % 4 === 0) { ctx.moveTo(cx - 1.5 * u, cy - u * .4); ctx.lineTo(cx - .75 * u, cy - u); ctx.lineTo(cx, cy - u * .4); ctx.lineTo(cx + .75 * u, cy - u); ctx.lineTo(cx + 1.5 * u, cy - u * .4); ctx.moveTo(cx - 1.5 * u, cy + u * .6); ctx.lineTo(cx - .75 * u, cy); ctx.lineTo(cx, cy + u * .6); ctx.lineTo(cx + .75 * u, cy); ctx.lineTo(cx + 1.5 * u, cy + u * .6); ctx.stroke(); }
    if (ci % 4 === 1) { ctx.arc(cx, cy, u * 1.1, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(cx, cy, u * .3, 0, 7); ctx.fill(); }
    if (ci % 4 === 2) { ctx.ellipse(cx, cy - u * .7, u * .55, u * .7, 0, 0, 7); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + u * 1.4); ctx.moveTo(cx - u, cy + u * .3); ctx.lineTo(cx + u, cy + u * .3); ctx.stroke(); }
    if (ci % 4 === 3) { ctx.moveTo(cx - 1.4 * u, cy); ctx.quadraticCurveTo(cx, cy - 1.3 * u, cx + 1.4 * u, cy); ctx.quadraticCurveTo(cx, cy + 1.3 * u, cx - 1.4 * u, cy); ctx.stroke(); ctx.beginPath(); ctx.arc(cx, cy, u * .4, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  function drawEmptyStone(x, y, s) {
    const ctx = PL.ctx, g = s * .05;
    ctx.fillStyle = '#2b3370'; prr(ctx, x + g, y + g, s - 2 * g, s - 2 * g, s * .14); ctx.fill();
    ctx.fillStyle = '#323b7d'; prr(ctx, x + g, y + g, s - 2 * g, s * .1, s * .05); ctx.fill();
  }

  function pPos(e) {
    const b = $('p-canvas').getBoundingClientRect();
    return { x: (e.clientX - b.left) * (PL.W / b.width), y: (e.clientY - b.top) * (PL.H / b.height) };
  }
  function pDragPos() {
    const sh = PSHAPES[PG.tray[PG.drag.slot].s], w = sh.w * PL.cell, h = sh.h * PL.cell;
    return { px: PG.drag.x - w / 2, py: PG.drag.touch ? PG.drag.y - h - PL.cell * .9 : PG.drag.y - h / 2, sh };
  }
  function pPreview() {
    if (!PG || !PG.drag) return null;
    const { px, py, sh } = pDragPos();
    const c0 = Math.round((px - PL.pad) / PL.cell), r0 = Math.round((py - PL.pad) / PL.cell);
    if (!pCanPlace(sh, r0, c0)) return { valid: false };
    return { valid: true, r0, c0, sh, ...pLines(sh, r0, c0) };
  }
  function pDown(e) {
    ensureAudio();
    if (!PG || PG.over) return;
    const { x, y } = pPos(e);
    if (PG.target >= 0) { pUsePowerAt(x, y); return; }
    if (y < PL.trayY - PL.cell * .3) return;
    const slot = Math.max(0, Math.min(2, Math.floor(x / (PL.W / 3))));
    if (!PG.tray[slot]) return;
    PG.drag = { slot, x, y, touch: e.pointerType !== 'mouse' };
    try { $('p-canvas').setPointerCapture(e.pointerId); } catch (err) {}
    tone(660, 0, .06, 'triangle', .06);
    e.preventDefault();
  }
  function pMove(e) { if (PG && PG.drag) { const p = pPos(e); PG.drag.x = p.x; PG.drag.y = p.y; } }
  function pUp() {
    if (!PG || !PG.drag) return;
    const pv = pPreview(), slot = PG.drag.slot;
    PG.drag = null;
    if (pv && pv.valid) pPlace(slot, pv.r0, pv.c0);
  }

  function pPlace(slot, r0, c0) {
    const p = PG.tray[slot], sh = PSHAPES[p.s], now = performance.now();
    const { rows, cols } = pLines(sh, r0, c0);
    for (const [r, c] of sh.cells) { PG.board[r0 + r][c0 + c] = p.color; PG.placeFx.push({ r: r0 + r, c: c0 + c, t0: now }); }
    PG.tray[slot] = null;
    const lines = rows.size + cols.size;
    let gained = sh.cells.length;
    const cr = r0 + sh.h / 2, cc = c0 + sh.w / 2;
    if (lines) {
      PG.combo++; PG.sinceClear = 0;
      gained += 10 * lines * (lines + 1) / 2 * PG.combo;
      const gone = new Set();
      rows.forEach(r => { for (let c = 0; c < PN; c++) gone.add(r * PN + c); });
      cols.forEach(c => { for (let r = 0; r < PN; r++) gone.add(r * PN + c); });
      gone.forEach(k => {
        const r = Math.floor(k / PN), c = k % PN;
        PG.clearFx.push({ r, c, color: PG.board[r][c], t0: now + (reduceMotion ? 0 : (Math.abs(r + .5 - cr) + Math.abs(c + .5 - cc)) * 22) });
        PG.board[r][c] = -1;
      });
      let stone = lines;
      if (PG.board.every(row => row.every(v => v < 0))) { stone += 10; gained += 300; PG.floats.push({ text: '¡Tablero limpio! +10 piedra', x: PN / 2, y: PN / 2 - 1, t0: now + 150, big: true }); }
      const before = Math.floor(PG.lines / STATUE_EVERY);
      PG.lines += lines; PG.stone += stone; S.stone = (S.stone || 0) + stone;
      PG.floats.push({ text: `+${stone} piedra`, x: cc, y: cr - 1, t0: now + 80, big: true });
      if (PG.combo >= 2) PG.floats.push({ text: `Combo ×${PG.combo}`, x: cc, y: cr + 1.2, t0: now + 160 });
      if (Math.floor(PG.lines / STATUE_EVERY) > before) {
        PG.statues++; addCat(randomStatueGenes(habFam()));
        elderSay(`¡Una estatua entre los bloques! Ya está en ${HABITATS[S.hab].short}.`);
        sfx.awake();
      }
      PG.shake = reduceMotion ? 0 : Math.min(4 + lines * 2, 12);
      const notes = [523, 659, 784, 1047, 1319, 1568], up = 1 + .06 * Math.min(PG.combo - 1, 6);
      for (let i = 0; i < Math.min(2 + lines, notes.length); i++) tone(notes[i] * up, i * .06, .18, 'square', .05);
      tone(110, 0, .25, 'triangle', .22);
      buzz(lines >= 2 ? [15, 30, 25] : 18);
      setStoneHud();
    } else {
      PG.sinceClear++; if (PG.sinceClear >= 3) PG.combo = 0;
      tone(180, 0, .12, 'triangle', .22); tone(90, 0, .08, 'sine', .1); buzz(8);
    }
    PG.score += gained;
    PG.floats.push({ text: `+${gained}`, x: cc, y: cr, t0: now, plain: true });
    if (PG.tray.every(t => !t)) pDeal();
    $('p-lines').textContent = PG.lines;
    $('p-combo').innerHTML = PG.combo >= 2 ? `<b style="color:var(--gold)">Combo ×${PG.combo}</b>` : '';
    save();
    pCheckStuck();
  }
  function pCheckStuck() {
    if (!PG || PG.over) return;
    const fits = PG.tray.some(t => t && pFits(PSHAPES[t.s]));
    const usable = PG.powers.some(p => p.charges > 0);
    PG.stuck = !fits && usable;
    $('p-stuck').hidden = !PG.stuck;
    if (!fits && !usable) { PG.over = true; setTimeout(() => pGameOver(false), 800); }
  }
  function renderPyrPowers() {
    renderPowerBar($('p-powers'), PG.powers, PG.target, i => {
      if (!PG || PG.over) return;
      ensureAudio();
      const p = PG.powers[i];
      if (p.key === 'reroll') { p.charges--; pDeal(); PG.target = -1; sfx.meow(); buzz(12); renderPyrPowers(); pCheckStuck(); return; }
      PG.target = PG.target === i ? -1 : i;
      $('p-note').textContent = PG.target >= 0 ? `${p.desc}. Toca el poder otra vez para cancelar.` : PYR_NOTE;
      renderPyrPowers();
    });
  }
  function pUsePowerAt(x, y) {
    const p = PG.powers[PG.target], now = performance.now();
    if (!p || !p.charges) return;
    if (p.key === 'small') {
      if (y < PL.trayY - PL.cell * .3) { toast('Toca uno de los bloques de abajo.'); return; }
      const slot = Math.max(0, Math.min(2, Math.floor(x / (PL.W / 3))));
      const t = PG.tray[slot]; if (!t) return;
      PG.tray[slot] = { s: 0, color: t.color };
    } else {
      const c = Math.floor((x - PL.pad) / PL.cell), r = Math.floor((y - PL.pad) / PL.cell);
      if (r < 0 || c < 0 || r >= PN || c >= PN) { toast('Toca una casilla del tablero.'); return; }
      if (p.key === 'claw' && PG.board[r][c] < 0) { toast('Toca un bloque del tablero.'); return; }
      const cells = p.key === 'claw' ? [[r, c]] : p.key === 'avalanche' ? [-1, 0, 1].flatMap(dr => [-1, 0, 1].map(dc => [r + dr, c + dc])).filter(([a, b]) => a >= 0 && b >= 0 && a < PN && b < PN) : Array.from({ length: PN }, (_, k) => [[r, k], [k, c]]).flat();
      cells.forEach(([rr, cc]) => { if (PG.board[rr][cc] >= 0) { PG.clearFx.push({ r: rr, c: cc, color: PG.board[rr][cc], t0: now }); PG.board[rr][cc] = -1; } });
      PG.shake = reduceMotion ? 0 : 6;
    }
    p.charges--; PG.target = -1; $('p-note').textContent = PYR_NOTE;
    sfx.meow(); buzz([15, 30, 15]);
    renderPyrPowers(); pCheckStuck();
  }
  function setStoneHud() {
    if ($('p-stone')) $('p-stone').textContent = PG.stone;
    $('stone').textContent = S.stone || 0;
    const p = $('purse-stone'); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump');
  }

  function pGameOver(quit) {
    if (!PG) return;
    PG.over = true;
    const record = PG.score > (S.pyrBest || 0);
    if (record) S.pyrBest = PG.score;
    if (record && PG.score > 200) setTimeout(() => elderSay(`¡Nuevo récord en Pirámide: ${PG.score} puntos!`), 600);
    save();
    if (!quit) [392, 330, 262, 196].forEach((f, i) => tone(f, i * .14, .3, 'sawtooth', .05));
    else sfx.awake();
    const g = PG;
    $('p-stuck').hidden = true;
    openSheet(`<div class="center"><div class="big-name">${quit ? 'Partida terminada' : 'Ya no cabe ningún bloque'}</div>
      <span class="note">${g.score} puntos · ${g.lines} líneas${record ? ' · ¡nuevo récord!' : ''}</span></div>
      <div class="new-mut">+${g.stone} de piedra para el templo${g.statues ? ` y ${g.statues} estatua${g.statues > 1 ? 's' : ''}` : ''}</div>
      <p class="note">Usa la piedra en "Mejorar templo": más sarcófagos, un altar mayor y decoraciones.</p>
      <div class="actions"><button class="btn" id="p-home" type="button">Ir al templo</button><button class="btn gold" id="p-again" type="button">Jugar otra vez</button></div>`);
    $('p-again').addEventListener('click', () => { closeSheet(); openPyramid(g.team); });
    $('p-home').addEventListener('click', () => { closeSheet(); closePyramid('templo'); });
  }

  let pLast = 0;
  function pLoop(now) {
    if (!PG) return;
    pRender(now);
    if (PG.shown !== PG.score) { PG.shown = PG.shown < PG.score ? Math.min(PG.score, PG.shown + Math.max(1, Math.ceil((PG.score - PG.shown) * .18))) : PG.score; const s = $('p-score'); if (s) s.textContent = PG.shown; }
    requestAnimationFrame(pLoop);
  }
  function pRender(now) {
    const ctx = PL.ctx, { W, H, pad, cell, tcell, trayY, trayH } = PL;
    if (!ctx || !W) return;
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (PG.shake > .2) { ctx.translate((Math.random() - .5) * PG.shake, (Math.random() - .5) * PG.shake); PG.shake *= .86; } else PG.shake = 0;
    ctx.fillStyle = '#c9a66b'; prr(ctx, 0, 0, W, W, cell * .32); ctx.fill();
    ctx.fillStyle = '#1d2458'; prr(ctx, pad * .5, pad * .5, W - pad, W - pad, cell * .28); ctx.fill();
    const pv = pPreview(), piece = PG.drag ? PG.tray[PG.drag.slot] : null;
    const willClear = (r, c) => pv && pv.valid && (pv.rows.has(r) || pv.cols.has(c));
    for (let r = 0; r < PN; r++) for (let c = 0; c < PN; c++) {
      const x = pad + c * cell, y = pad + r * cell, v = PG.board[r][c];
      if (v < 0) drawEmptyStone(x, y, cell); else drawStone(x, y, cell, willClear(r, c) ? piece.color : v);
    }
    if (pv && pv.valid) for (const [r, c] of pv.sh.cells) { const R = pv.r0 + r, C = pv.c0 + c; drawStone(pad + C * cell, pad + R * cell, cell, piece.color, willClear(R, C) ? .9 : .42); }
    for (let i = PG.placeFx.length - 1; i >= 0; i--) {
      const f = PG.placeFx[i], t = (now - f.t0) / 220;
      if (t >= 1) { PG.placeFx.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(255,255,255,${.45 * (1 - t)})`; prr(ctx, pad + f.c * cell + cell * .05, pad + f.r * cell + cell * .05, cell * .9, cell * .9, cell * .14); ctx.fill();
    }
    const dur = reduceMotion ? 150 : 380;
    for (let i = PG.clearFx.length - 1; i >= 0; i--) {
      const f = PG.clearFx[i], t = (now - f.t0) / dur, x = pad + f.c * cell, y = pad + f.r * cell;
      if (t < 0) { drawStone(x, y, cell, f.color); continue; }
      if (t >= 1) { PG.clearFx.splice(i, 1); continue; }
      const s = cell * (1 - t * t), o = (cell - s) / 2;
      drawStone(x + o, y + o, s, f.color, 1 - t * .6);
      if (t < .35) { ctx.fillStyle = `rgba(255,240,200,${.8 * (1 - t / .35)})`; prr(ctx, x + o, y + o, s, s, s * .14); ctx.fill(); }
    }
    const slotW = W / 3;
    for (let i = 0; i < 3; i++) {
      const p = PG.tray[i];
      if (!p || (PG.drag && PG.drag.slot === i)) continue;
      const sh = PSHAPES[p.s], fits = pFits(sh);
      const ox = (i + .5) * slotW - sh.w * tcell / 2, oy = trayY + trayH / 2 - sh.h * tcell / 2;
      for (const [r, c] of sh.cells) drawStone(ox + c * tcell, oy + r * tcell, tcell, p.color, fits ? 1 : .28);
    }
    if (PG.drag) {
      const { px, py, sh } = pDragPos();
      ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = cell * .4; ctx.shadowOffsetY = cell * .15;
      for (const [r, c] of sh.cells) drawStone(px + c * cell, py + r * cell, cell, piece.color);
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    }
    ctx.restore();
    for (let i = PG.floats.length - 1; i >= 0; i--) {
      const f = PG.floats[i], t = (now - f.t0) / 900;
      if (t < 0) continue;
      if (t >= 1) { PG.floats.splice(i, 1); continue; }
      const size = cell * (f.big ? .5 : .44) * (t < .15 ? .6 + t / .15 * .4 : 1);
      const x = Math.max(cell * 2.4, Math.min(W - cell * 2.4, pad + f.x * cell)), y = pad + f.y * cell - t * cell * (reduceMotion ? 0 : 1.1);
      ctx.globalAlpha = 1 - t * t;
      ctx.font = `${size}px "Bagel Fat One", "Arial Rounded MT Bold", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.lineWidth = size * .22; ctx.strokeStyle = '#1d2458'; ctx.strokeText(f.text, x, y);
      ctx.fillStyle = f.plain ? '#ffffff' : '#f4c24f'; ctx.fillText(f.text, x, y);
      ctx.globalAlpha = 1;
    }
  }

  // ================= Mejoras del templo (se pagan con piedra) =================
  const UPGRADES = [
    { id: 'sarc3', name: 'Tercer nido de cría', desc: 'Un lugar más para criar en cada hábitat.', cost: 30 },
    { id: 'sarc4', name: 'Cuarto nido de cría', desc: 'Otro lugar más para criar en cada hábitat.', cost: 60, needs: 'sarc3' },
    { id: 'altar', name: 'Altar mayor', desc: 'El altar guarda hasta 80 ofrendas y junta 1 cada 3 s.', cost: 25 },
    { id: 'patio', name: 'Patio amplio', desc: 'Caben 24 gatos paseando a la vez (antes 14).', cost: 40 },
    { id: 'estandartes', name: 'Estandartes', desc: 'Banderas azul y oro en las columnas (Egipto).', cost: 10 },
    { id: 'obeliscos', name: 'Obeliscos', desc: 'Dos obeliscos dorados junto a las pirámides (Egipto).', cost: 20 },
    { id: 'estanque', name: 'Estanque de lotos', desc: 'Un estanque con lotos en el patio (Egipto).', cost: 25 },
  ];
  function openUpgrades() {
    ensureAudio();
    const have = S.stone || 0;
    openSheet(`<div class="sheet-head"><h2>Mejoras</h2><button class="x" id="x" type="button" aria-label="Cerrar">×</button></div>
      <p class="note" style="text-align:left">Tienes <b style="color:var(--ink)">${have} de piedra</b>. La piedra se gana en Pirámide: 1 por cada línea.</p>
      <div class="ups">${UPGRADES.map(u => {
        const done = S.up && S.up[u.id], locked = u.needs && !(S.up && S.up[u.needs]);
        return `<div class="up${done ? ' done' : ''}"><div><b>${u.name}</b><small>${u.desc}${locked ? ' Primero construye el anterior.' : ''}</small></div>
          ${done ? '<span class="up-ok">Construido</span>' : `<button class="btn ${have >= u.cost && !locked ? 'gold' : ''}" data-up="${u.id}" type="button" ${have >= u.cost && !locked ? '' : 'disabled'}>${u.cost} piedra</button>`}</div>`;
      }).join('')}</div>
      <button class="btn turq" id="go-pyr" type="button">Jugar Pirámide para ganar piedra</button>`);
    $('x').addEventListener('click', closeSheet);
    $('go-pyr').addEventListener('click', () => { closeSheet(); pickTeam('pyr', openPyramid); });
    document.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => buyUpgrade(b.dataset.up)));
  }
  function buyUpgrade(id) {
    const u = UPGRADES.find(x => x.id === id);
    if (!u || (S.stone || 0) < u.cost || (S.up && S.up[id])) return;
    S.stone -= u.cost; S.up = { ...(S.up || {}), [id]: true };
    if (id === 'sarc3' || id === 'sarc4') HAB_ORDER.forEach(h => S.habs[h].slots.push(null));
    $('stone').textContent = S.stone;
    save(); sfx.awake(); buzz([20, 40, 20]);
    renderTemplo(); openUpgrades();
    elderSay(`¡${u.name} listo! Así da gusto vivir aquí.`);
  }

  // ================= Navegación y hoja =================
  function openSheet(html) { $('sheet-card').innerHTML = html; $('sheet').hidden = false; $('sheet-card').scrollTop = 0; }
  function closeSheet() { $('sheet').hidden = true; $('sheet-card').innerHTML = ''; }
  $('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

  function showTab(t) {
    S.tab = t;
    ['templo', 'gatos', 'juegos'].forEach(n => { $('tab-' + n).hidden = n !== t; });
    document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    if (t === 'templo') renderTemplo();
    if (t === 'gatos') renderGatos();
    if (t === 'juegos') renderJuegos();
    window.scrollTo(0, 0);
    save();
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { ensureAudio(); showTab(b.dataset.tab); }));

  function renderAll() {
    $('ofr').textContent = S.ofrendas;
    $('stone').textContent = S.stone || 0;
    $('tabs').hidden = !S.sphinxAwake;
    renderTemplo(); renderGatos(); renderJuegos();
    showTab(S.sphinxAwake ? S.tab : 'templo');
  }

  // ================= Arranque =================
  function start(data) {
    loadArt();
    const d = data && data.v === 1 && Array.isArray(data.cats) ? data : load();
    if (d) S = { ...freshState(), ...d };
    // partidas guardadas antes de los hábitats: todo pasa a Egipto
    if (d && !(d.habs && d.habs.egipto)) { S.habs = freshHabs(); if (Array.isArray(d.slots)) S.habs.egipto.slots = d.slots.slice(); }
    delete S.slots;
    const nests = 2 + (S.up && S.up.sarc3 ? 1 : 0) + (S.up && S.up.sarc4 ? 1 : 0);
    HAB_ORDER.forEach(h => { if (!S.habs[h]) S.habs[h] = { open: h === 'egipto', slots: [] }; while (S.habs[h].slots.length < nests) S.habs[h].slots.push(null); });
    if (!S.hab || !S.habs[S.hab] || !S.habs[S.hab].open) S.hab = 'egipto';
    S.cats.forEach(c => { if (!c.hab) c.hab = 'egipto'; });
    renderAll();
    setInterval(tickTemplo, 1000);
    setInterval(() => { if (skyMode() !== mode && !$('tab-templo').hidden) renderTemplo(); }, 60000);
    if (window.ResizeObserver) new ResizeObserver(placeWalkers).observe(document.body);
    requestAnimationFrame(walkLoop);
    addEventListener('resize', () => { if (PG) pLayout(); });
    setInterval(() => { if (S.births) { S.tip++; } }, 12000);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => S);
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || null);
})();
</script>
</body>
</html>
